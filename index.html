<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d8a9e">
<meta name="description" content="3D virtual chemistry lab: qualitative reactions of cations and anions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ChemLab 3D">
<title>Бейорганикалық химия зертханасы 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Display:wdth,wght@75,600;75,700&display=swap">
<style>
/* Layout: Nobook-style dark lab — header, glassware rail on top, workbench centre, reagent shelf on the right, vessel card + journal below */
:root{
  color-scheme: light;
  --bg:#e8eef1; --panel:#ffffff; --panel-2:#f1f5f7; --line:#d2dce2;
  --bench:#edf2f4; --bench-2:#cdd7dd;
  --fg:#1b2932; --muted:#5d6f7b; --accent:#0d8a9e; --accent-soft:rgba(13,138,158,.12);
  --warn:#b26a00; --good:#2f8f52;
  --glass:rgba(58,82,100,.78);
  --font-ui:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Noto Sans Display","Noto Sans",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;gap:8px;
  grid-template-columns:minmax(0,1fr) 300px;
  grid-template-rows:auto auto minmax(0,1fr) 230px;
  grid-template-areas:"head head" "tools reag" "bench reag" "foot reag";
  padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
header{grid-area:head;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--font-display);font-stretch:75%;font-weight:700;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

/* top rail */
.tools{grid-area:tools;display:flex;gap:14px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;touch-action:pan-x}
.tgroup{display:flex;flex-direction:column;gap:2px;flex:none}
.tgroup .cap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.titems{display:flex;gap:4px}
.titem{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:8px;background:transparent;border:1px solid transparent;cursor:grab;user-select:none;-webkit-user-select:none}
.titem:hover{background:var(--panel-2)}
.titem svg{width:34px;height:40px;color:#3a5568}
.titem .n{font-size:10.5px;line-height:1.2;text-align:center;color:var(--fg)}
.titem .sz{font-size:9.5px;line-height:1.3;color:var(--accent);background:var(--panel-2);border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
.szmenu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(20,40,50,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.szmenu .szt{font-size:11.5px;color:var(--muted)}
.szmenu .szb{display:flex;gap:6px;align-items:flex-end}
.szmenu button{font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:58px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.szmenu button svg{fill:rgba(190,222,240,.55);stroke:#3a5568;stroke-width:1.4}
.szmenu button:hover{border-color:var(--accent)}
.szmenu button[aria-checked="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--panel)}
.armed{border-color:var(--accent)!important;background:var(--accent-soft)!important}

/* bench */
.bench{grid-area:bench;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);
  background:
   var(--bench);
  touch-action:none;min-height:380px}
.bench::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;z-index:1;background:linear-gradient(180deg,#d7e0e5 0,#c3ced5 6px,#b5c1c9 100%);border-top:1px solid #eef3f5;box-shadow:0 -1px 0 #9fb0ba;pointer-events:none}
.backdrop{position:absolute;inset:0;z-index:0;pointer-events:none}
.links{position:absolute;left:0;top:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible}
.backdrop svg{width:100%;height:100%;display:block}
.hintbar{position:absolute;left:10px;top:10px;right:10px;z-index:30;display:flex;gap:8px;align-items:center;pointer-events:none}
.hintbar .msg{background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(30,50,60,.08);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:60ch;pointer-events:auto}
.hintbar .msg.on{color:var(--fg);border-color:var(--accent)}
.hintbar .btn{pointer-events:auto;padding:4px 10px}
.trash{position:absolute;right:12px;bottom:44px;z-index:25;border:1.5px dashed var(--warn);color:var(--warn);border-radius:10px;padding:14px 18px;font-size:12px;background:rgba(242,178,76,.08)}
.trash.hot{background:rgba(242,178,76,.25)}

.obj{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;z-index:5;background:none;border:0;padding:0}
.obj.dragging{cursor:grabbing;z-index:40;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(30,50,60,.3))}
.obj svg{display:block;overflow:visible}
.obj .vname{font-size:10.5px;line-height:1.15;text-align:center;color:var(--fg);background:rgba(255,255,255,.88);box-shadow:0 1px 3px rgba(30,50,60,.12);padding:2px 6px;border-radius:7px;white-space:nowrap}
.obj.onflame .vname{position:absolute;right:calc(100% + 8px);bottom:30px}
.obj .vname small{font-size:10px;font-variant-numeric:tabular-nums}
.obj.sel .vname{color:#fff;background:var(--accent);font-weight:600}
.obj.target svg{filter:drop-shadow(0 0 7px rgba(87,199,217,.75))}
.gaschip{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#f2b24c;color:#2a1c05;border:0;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer;white-space:nowrap;z-index:6}
.note{position:absolute;z-index:45;background:var(--panel);box-shadow:0 4px 14px rgba(30,50,60,.15);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;max-width:220px;pointer-events:none;animation:noteFade 4.2s forwards;display:flex;gap:7px;align-items:center}
.note i{display:block;width:12px;height:30px;border-radius:2px;flex:none}
@keyframes noteFade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.bub circle{fill:rgba(255,255,255,.35);stroke:rgba(60,90,110,.55);stroke-width:.9;animation:rise var(--d) ease-in var(--dl) both}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--rise));opacity:0}}
.cloud{animation:cloud 6s ease-out forwards}
@keyframes cloud{0%{opacity:0;transform:translateY(8px)}15%{opacity:.85}100%{opacity:0;transform:translateY(-26px)}}
.liq,.susp,.ppt{transition:y .5s ease,height .5s ease,fill .6s ease,opacity .6s ease,transform .6s ease}
.tilt,.men{transition:transform .6s ease}
.flame{transform-origin:55px 46px;animation:flick .16s infinite alternate}
@keyframes flick{from{transform:scale(1,.94)}to{transform:scale(.97,1.05)}}
.flare{animation:flare 3s ease-out forwards}
@keyframes flare{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* reagent shelf */
.reag{grid-area:reag;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.amt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow-y:auto;min-height:0;align-content:start;touch-action:pan-y;padding-right:2px}
.ritem{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px 7px;border-radius:9px;background:var(--panel-2);border:1px solid transparent;cursor:grab;user-select:none;-webkit-user-select:none;min-width:0}
.ritem:hover{border-color:var(--line)}
.ritem svg{width:38px;height:48px}
.ritem .f{font-weight:600;font-size:12.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ritem .n{font-size:10px;line-height:1.2;color:var(--muted);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* bottom */
.foot{grid-area:foot;display:grid;grid-template-columns:280px minmax(0,1fr);gap:8px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:auto;min-height:0;min-width:0}
.card h2{font-family:var(--font-display);font-stretch:75%;font-size:15px;margin:0 0 6px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.grp{margin-top:7px}
.grp .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.vact{display:flex;gap:6px;margin-top:10px}
.je{padding:7px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
.je:last-child{border-bottom:0}
.je .hd{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.je .hd b{color:var(--fg);font-weight:600}
.je .eq{font-family:var(--font-display);font-stretch:75%;font-size:15px;color:var(--accent);letter-spacing:.01em}
.je .ob{font-size:13px;line-height:1.45}
.je .tip{font-size:12.5px;color:var(--warn)}

.dose{position:absolute;z-index:60;width:268px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;box-shadow:0 14px 34px rgba(30,50,60,.22);display:grid;gap:8px;touch-action:auto;cursor:default}
.dose .dh{display:flex;gap:9px;align-items:center}
.dose .dh svg{width:30px;height:38px;flex:none}
.dose .dh b{font-size:14px}
.dose .small{font-size:11.5px}
.dose .seg{width:100%}
.dose .seg button{flex:1}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchips button{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.dchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dinput{display:flex;align-items:center;gap:6px}
.dinput button{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;font-size:16px;line-height:1}
.dinput input{flex:1;min-width:0;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);padding:0 8px;font:inherit;font-size:15px;font-variant-numeric:tabular-nums}
.dinput span{color:var(--muted);font-size:12px;min-width:40px}
.dcalc{font-size:12px;line-height:1.45;color:var(--muted);font-variant-numeric:tabular-nums}
.dcalc b{color:var(--fg);font-weight:600}
.dcalc .warn{color:var(--warn)}
.dbtns{display:flex;gap:6px;justify-content:flex-end}
.btn:disabled{opacity:.45;cursor:not-allowed}
.doser{position:absolute;z-index:35;pointer-events:none;left:0;top:0;width:0;height:0;transition:opacity .3s}
.doser.out{opacity:0}
.doser>*{position:absolute}
.drop{position:absolute;z-index:36;width:6px;height:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.lightfx{position:absolute;inset:0;z-index:33;pointer-events:none}
.burnfx{position:absolute;z-index:34;width:68px;height:90px;border-radius:50% 50% 45% 45%;pointer-events:none;filter:blur(1.5px);transform-origin:50% 85%}
.spark{position:absolute;z-index:35;width:3px;height:3px;border-radius:50%;pointer-events:none}
.grain{position:absolute;z-index:36;width:4px;height:4px;border-radius:1px;pointer-events:none}
.stream{width:3px;border-radius:2px;transform-origin:top center;opacity:.9}
.gtube{border:1.5px solid var(--glass);background:rgba(200,226,240,.08)}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
.ghost svg{width:44px;height:54px}

/* guide */
.overlay{position:fixed;inset:0;z-index:2000;background:rgba(20,32,40,.45);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:920px;width:100%;max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal .mh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0 auto 0 0;font-family:var(--font-display);font-stretch:75%;font-size:19px}
.modal .mb{overflow:auto;padding:4px 14px 14px}
.modal h3{font-family:var(--font-display);font-stretch:75%;font-size:15px;margin:14px 0 6px;color:var(--accent);letter-spacing:.03em}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td:first-child{font-family:var(--font-display);font-stretch:75%;font-size:15px;white-space:nowrap}

/* 3D stage */
.bench{background:#e9eef1;min-height:440px}
.bench::after{display:none}
.stage3d{position:absolute;inset:0;z-index:0}
.stage3d canvas{display:block;cursor:grab;touch-action:none}
.stage3d canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.vlabel{left:0;top:0;pointer-events:auto;will-change:transform}
.vlabel.onflame .vname{position:static}
.vlabel.dragging{opacity:.55}
.labels .gaschip{left:0;top:0;pointer-events:auto}
.camhelp{position:absolute;left:10px;bottom:10px;z-index:7;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:8px;padding:4px 9px;pointer-events:none;max-width:calc(100% - 330px)}
.benchbtns{position:absolute;right:10px;bottom:10px;z-index:8;display:flex;gap:6px}
.bbtn .x{display:none}.bbtn.muted .x{display:inline}.bbtn.muted .wave{display:none}.bbtn.muted{color:var(--muted)}
.bbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--fg);box-shadow:0 2px 8px rgba(30,50,60,.1)}
.bbtn:hover{border-color:var(--accent)}
.lightsw .lev{transition:transform .25s ease}
.lightsw.off{background:#1d252b;color:#f2c14e;border-color:#3a464f}
.lightsw.off .lev{transform:translateY(9px)}
/* phones held sideways: compact chrome, the 3D table takes almost the whole screen height */
@media (max-height:520px) and (orientation:landscape){
  html,body{height:auto}
  .app{height:auto;gap:6px;padding-block:6px;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:auto auto calc(100svh - 112px) 260px}
  .brand h1{font-size:16px} .brand span{display:none}
  .hbtns .btn{padding:4px 8px;font-size:12px} .seg button{padding:4px 8px}
  .tools{padding:2px 8px;gap:8px} .tgroup .cap{display:none} .titem{width:56px;padding:2px} .titem svg{width:22px;height:26px} .titem .n{font-size:9.5px}
  .bench{min-height:0}
  .reag{padding:6px;height:calc(100svh - 60px);align-self:start} .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .ritem svg{width:26px;height:32px} .amt{display:none}
  .camhelp{display:none}
}
.tbadge{position:absolute;left:0;top:0;z-index:6;pointer-events:none;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff;color:#1b2932;border:1.5px solid #d4352a;border-radius:7px;padding:1px 6px;white-space:nowrap;box-shadow:0 2px 6px rgba(30,50,60,.15)}
.tbadge.hot{background:#d4352a;color:#fff}
.indmenu .indgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.indit{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font:inherit;font-size:11.5px;line-height:1.2;color:var(--fg);cursor:grab;width:100px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.indit:hover{border-color:var(--accent)}
.indit svg{width:26px;height:32px;color:#3a5568}
#indBtn{cursor:pointer}
.navbtns{position:absolute;top:10px;right:10px;z-index:31;display:flex;gap:6px}
.enterbtn{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:31;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(13,138,158,.35)}
.speech{position:absolute;left:0;top:0;z-index:8;max-width:240px;background:#fff;border:1.5px solid var(--accent);border-radius:12px;padding:7px 10px;font-size:12.5px;line-height:1.35;box-shadow:0 6px 18px rgba(30,50,60,.18);pointer-events:none;animation:noteFade 4.5s forwards}
.speech b{display:block;color:var(--accent);font-size:11px;margin-bottom:2px}
.app.outside{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head" "bench"}
.app.outside .tools,.app.outside .reag,.app.outside .foot{display:none}
.app.outside .bench{min-height:60vh}

/* ===================== REDESIGN: full-bleed 3D stage, floating glass panels, one accent ===================== */
:root{--glass:rgba(255,255,255,.93);--glass-edge:rgba(255,255,255,.75);--lift:0 12px 32px rgba(17,40,52,.16),0 0 0 1px rgba(20,50,60,.06);--rw:300px;--ease:cubic-bezier(.65,0,.35,1)}
.brandrow{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brandrow .brand{margin-right:0}
.mark{width:36px;height:36px;flex:none;border-radius:10px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 12px rgba(13,138,158,.35)}
.mark svg{width:22px;height:22px}
#bTour{display:inline-flex;align-items:center;gap:6px}
#bTour svg{width:16px;height:16px}
.console{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:4px 0 8px}
.console:empty{display:none}
.gauge{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 8px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gk{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{font-family:var(--font-display);font-stretch:75%;font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.gv.hot{color:#d4352a}.gv small{font-size:11px;color:var(--muted);font-weight:500;font-family:var(--font-ui);font-stretch:100%}
.dial{width:100%;height:auto;max-height:58px}
.spark{width:100%;height:20px}
.gnote{font-size:10.5px;color:var(--muted);line-height:1.2}
.phbar{position:relative;height:12px;border-radius:6px;margin-top:8px}
.phbar i{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;background:#1b2932;border-radius:2px;box-shadow:0 0 0 2px #fff;transition:left .4s var(--ease)}
.phs{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px}
.vbar{position:relative;height:42px;width:26px;border:1.5px solid #6d808b;border-top:0;border-radius:0 0 7px 7px;margin-top:4px;overflow:hidden;background:rgba(255,255,255,.7)}
.vbar i{position:absolute;left:0;right:0;bottom:0;transition:height .4s var(--ease)}
.paneltog{display:none}
.jtog{padding:3px 9px!important;font-size:12px!important;margin-left:6px}
#jcard h2>span{margin-right:auto}
#jcard.collapsed{max-height:84px;overflow:hidden}
.camhelp.gone{opacity:0}
@media (max-width:820px){.camhelp{display:none!important}}
.tourcap{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:41;max-width:min(620px,calc(100% - 32px));background:#1b2932;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;line-height:1.4;box-shadow:0 10px 26px rgba(17,40,52,.3);animation:capIn .5s cubic-bezier(.16,1,.3,1)}
.tourcap .tn{display:inline-block;margin-right:10px;color:#7fd6e2;font-weight:700;font-variant-numeric:tabular-nums}
@keyframes capIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:821px){
  html,body{height:100%;overflow:hidden}
  .app{position:relative;display:block;height:100%;padding:0}
  .bench{position:absolute;inset:0;border:0;border-radius:0;min-height:0}
  header,.tools,.reag,.foot .card{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--lift)}
  header{position:absolute;z-index:40;top:12px;left:16px;right:16px;padding:8px 10px 8px 12px;border-radius:14px}
  .brand h1{font-size:19px}
  .tools{position:absolute;z-index:39;top:calc(var(--hdr,68px) + 10px);left:16px;right:calc(var(--rw) + 32px);border-radius:14px;transition:right .35s var(--ease)}
  .reag{position:absolute;z-index:39;top:calc(var(--hdr,68px) + 10px);right:16px;bottom:16px;width:var(--rw);border-radius:14px;transition:width .35s var(--ease)}
  .paneltog{display:grid;place-items:center;align-self:flex-start;width:32px;height:28px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--fg)}
  .app.reag-min{--rw:54px}
  .app.reag-min .reag>*:not(.paneltog){display:none}
  .app.reag-min .paneltog svg{transform:rotate(180deg)}
  .foot{position:absolute;z-index:39;left:16px;right:calc(var(--rw) + 32px);bottom:16px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;pointer-events:none;align-items:end;transition:right .35s var(--ease)}
  .foot .card{pointer-events:auto;border-radius:14px;max-height:40vh}
  .hintbar{top:calc(var(--tl,190px) + 10px);left:16px;right:calc(var(--rw) + 32px)}
  .camhelp{top:calc(var(--tl,190px) + 56px);bottom:auto;left:16px;transition:opacity .6s}
  .benchbtns{top:calc(var(--tl,190px) + 10px);bottom:auto;right:calc(var(--rw) + 32px);transition:right .35s var(--ease)}
  .navbtns{top:calc(var(--tl,190px) + 56px);right:calc(var(--rw) + 32px);transition:right .35s var(--ease)}
  .trash{right:calc(var(--rw) + 32px);bottom:calc(40vh + 36px)}
  .tourcap{bottom:calc(40vh + 40px)}
  .app.outside .benchbtns,.app.outside .navbtns{right:16px}
  .app.outside .benchbtns{top:calc(var(--hdr,68px) + 10px)}
  .app.outside .navbtns{top:calc(var(--hdr,68px) + 56px)}
  .app.outside .camhelp{top:auto;bottom:10px}
  .app.outside .tourcap{bottom:24px}
}
@media (min-width:821px) and (max-height:760px){ .foot .card{max-height:34vh} .tourcap{bottom:calc(34vh + 40px)} .trash{bottom:calc(34vh + 36px)} }

.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"head" "tools" "bench" "reag" "foot"}
  .bench{height:470px}
  .reag{max-height:430px}
  .foot{grid-template-columns:minmax(0,1fr)}
  .foot .card{max-height:340px}
}
@media (prefers-reduced-motion:reduce){
  .bub circle,.flame,.cloud{animation-duration:.01s!important;animation-iteration-count:1!important}
  .liq,.susp,.ppt{transition:none}
}

/* ================= chemistry engine ================= */
function runReactions(v,heat){
  const fired=[];
  for(let it=0;it<260;it++){
    let done=false;
    for(const r of RULES){
      if(r.heat&&!heat) continue;
      if(r.dry){ if(v.vol>0) continue; } else if(!r.any&&!(v.vol>0)) continue;
      if(r.cond&&!r.cond(v,heat)) continue;
      let ext=Infinity;
      for(const k in r.r){ext=Math.min(ext,(v.sp[k]||0)/r.r[k]); if(!(ext>1e-4)) break;}
      if(!(ext>1e-4)) continue;
      for(const k in r.r){v.sp[k]-=r.r[k]*ext; if(v.sp[k]<1e-4) delete v.sp[k];}
      for(const k in r.p){
        const a=r.p[k]*ext;
        if(k[0]==='↑') gasEvolved(v,k.slice(1),a);
        else{ v.sp[k]=(v.sp[k]||0)+a; if(SP[k]&&SP[k].p) v.pptT=now(); }
      }
      if(!fired.includes(r.i)) fired.push(r.i);
      if(r.fx) v[r.fx]=true;
      if(r.dH&&typeof heatQ==='function') heatQ(v,-r.dH*ext);
      if(r.burn&&typeof tempOf==='function') v.temp=Math.max(tempOf(v),650);
      if(r.boom&&!v.boomed&&v.vol>0&&typeof explodeVessel==='function'){const mk=Object.keys(r.r).find(k=>SP[k]&&SP[k].sol); if((r.r[mk]||0)*ext/Math.max(v.vol,.05)>r.boom){v.boomed=true; setTimeout(()=>explodeVessel(v),RM()?0:380);}}
      if(r.burn) burnFx(v,r.burn);
      done=true; break;
    }
    if(!done) break;
  }
  return fired;
}
/* flame over the combustion spoon: coloured glow, flicker and sparks; the lamp flame takes the same colour */
function burnFx(v,col){
  if(RM()) return;
  const g=vGeom(v),cx=g.mx,cy=g.by-10;
  const f=document.createElement('div'); f.className='burnfx';
  Object.assign(f.style,{left:(cx-34)+'px',top:(cy-78)+'px',background:`radial-gradient(ellipse 50% 60% at 50% 72%, #fff 0%, ${col} 34%, ${col}66 58%, transparent 74%)`,boxShadow:`0 0 36px 10px ${col}55`});
  bench.appendChild(f);
  // the flash lights up the bench with white light: bright pool around the flame, the rest dims a little,
  // nearby glassware catches the light and throws a short shadow away from it
  const lx=cx,ly=cy-22,R=400,DUR=2800;
  const lt=document.createElement('div'); lt.className='lightfx';
  const W='255,253,244';
  lt.style.background=`radial-gradient(circle at ${lx}px ${ly}px, rgba(${W},.95) 0, rgba(${W},.6) 70px, rgba(${W},.22) 190px, rgba(${W},0) 300px), radial-gradient(circle at ${lx}px ${ly}px, transparent 0, transparent 140px, rgba(14,24,34,.22) 460px)`;
  bench.appendChild(lt);
  lt.animate([{opacity:0},{opacity:1,offset:.1},{opacity:.82,offset:.3},{opacity:1,offset:.5},{opacity:.86,offset:.75},{opacity:0}],{duration:DUR,easing:'ease-in-out'}).onfinish=()=>lt.remove();
  const brr=bench.getBoundingClientRect();
  [...S.vessels.map(o=>o.el),...S.lamps.map(o=>o.el)].forEach(el=>{
    const r=el.getBoundingClientRect(),ox=r.left-brr.left+r.width/2,oy=r.top-brr.top+r.height/2;
    const d=Math.hypot(ox-lx,oy-ly); if(d>R) return;
    const k=el===v.el?.35:1-d/R*.85, ux=d?(ox-lx)/d:0, uy=d?(oy-ly)/d:0;
    const F=(m)=>`brightness(${(1+.32*k*m).toFixed(2)}) drop-shadow(0px 0px ${(5+15*k*m).toFixed(1)}px rgba(${W},.95)) drop-shadow(${(ux*18*k*m).toFixed(1)}px ${((uy*8+5)*k*m).toFixed(1)}px 5px rgba(0,0,0,${(.32*k*m).toFixed(2)}))`;
    el.animate([{filter:F(0)},{filter:F(1),offset:.1},{filter:F(.78),offset:.3},{filter:F(1),offset:.5},{filter:F(.84),offset:.75},{filter:F(0)}],{duration:DUR,easing:'ease-in-out'});
  });
  f.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1.05)',opacity:1,offset:.12},{transform:'scale(.92,1.08)',opacity:.95,offset:.3},{transform:'scale(1.06,.95)',opacity:1,offset:.5},{transform:'scale(.95,1.06)',opacity:.9,offset:.75},{transform:'scale(.6)',opacity:0}],{duration:2800,easing:'ease-in-out'}).onfinish=()=>f.remove();
  for(let k=0;k<12;k++){const sk=document.createElement('div'); sk.className='spark'; sk.style.background=col; sk.style.boxShadow=`0 0 6px ${col}`;
    sk.style.left=cx+'px'; sk.style.top=(cy-8)+'px'; bench.appendChild(sk);
    const ang=-Math.PI/2+(Math.random()-.5)*2.2,d=26+Math.random()*44;
    sk.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d+18}px)`,opacity:0}],{duration:500+Math.random()*500,delay:Math.random()*1600,easing:'ease-out',fill:'both'}).onfinish=()=>sk.remove();}
}
function gasEvolved(v,g,a){
  v.gasHist.add(g);
  if(v.gasAvail&&v.gasAvail.g===g&&now()-v.gasAvail.t<25000) v.gasAvail.amt+=a; else v.gasAvail={g,amt:a,t:now()};
  v.gasAvail.t=now();
  if(v.vol>0) spawnBubbles(v,Math.min(26,6+Math.round(a*14)),1.6);
  if(v.linkTo&&S.vessels.includes(v.linkTo)){
    v.linkQ=v.linkQ||[]; let left=a;
    while(left>1e-4){const c=Math.min(left,.03); v.linkQ.push({g,a:c}); left-=c;}
    return;
  }
  if(GASC[g]) v.cloud={c:GASC[g],t:now()};
}

const WPH={'Ni2+':-.3,'Co2+':-.3,'F-':.2,'NiNH3':.5,'CoNH3':.5,'CrNH3':.4,'CH3COOHaq':-1.2,'CH3COO':.4,'NO2-':.2,'CrO4':.3,'Cr2O7':-.5,'Cr3+':-.8,'ClO-':.6,'MnO42':.5,'FeAc':-.3,'H2O2':-.05,'NH3aq':1,'CO3':1.2,'S2-':1.3,'PO4':1.3,'SiO3':1.2,'SO3':.8,'HCO3':.3,'AlOH4':.8,'ZnOH4':.8,'PbOH4':.8,'AgNH3':.3,'CuNH3':.5,'ZnNH3':.4,
 'CO2aq':-.6,'SO2aq':-1.2,'H2Saq':-.4,'NH4+':-.35,'Fe3+':-1,'Al3+':-.8,'Cu2+':-.5,'Zn2+':-.4,'Fe2+':-.3,'Pb2+':-.3,'H3PO4':-1,'Cl2aq':-.8,'FeSCN':-.6,'Mn2+':-.1};
function pH(v){
  if(v.vol<=0) return null;
  const c=((v.sp['H+']||0)-(v.sp['OH-']||0))/v.vol;
  if(c>0.02) return Math.max(.5,Math.min(2.8,1-Math.log10(c)));
  if(c<-0.02) return Math.min(13.5,Math.max(11.2,13+Math.log10(-c)));
  let s=0; for(const k in WPH) if(v.sp[k]) s+=WPH[k]*v.sp[k];
  s/=v.vol;
  return 7+3.3*Math.tanh(s);
}

  if(ph==null) return null;
  if(type==='php') return ph>=8.2?{c:[214,19,111],n:'crimson'}:{c:null,n:'colourless'};
  if(type==='mo') return ph<3.1?{c:[220,40,30],n:'red'}:ph<4.4?{c:[236,120,30],n:'orange'}:{c:[240,192,30],n:'yellow'};
  if(type==='lit') return ph<5?{c:[200,32,47],n:'red'}:ph<8?{c:[122,58,154],n:'violet'}:{c:[43,79,196],n:'blue'};
  return null;

function liquidColor(v){
  if(v.vol<=0) return null;
  let r=0,g=0,b=0,w=0;
  for(const k in v.sp){const s=SP[k]; if(s&&s.c&&!s.p&&!s.sol){const c=(v.sp[k]/v.vol)*(s.s||1); r+=s.c[0]*c; g+=s.c[1]*c; b+=s.c[2]*c; w+=c;}}
  let col=[140,190,224],a=.3;
  if(w>0){col=[r/w,g/w,b/w]; a=Math.min(.9,.2+w*.9);}
  if(v.ind){const ii=indInfo(v.ind,pH(v)); if(ii&&ii.c){const m=w>0?.6:.9; col=col.map((x,i)=>x*(1-m)+ii.c[i]*m); a=Math.max(a,.62);}}
  return {col,a};
}
function pptInfo(v){
  let tot=0,r=0,g=0,b=0;
  for(const k in v.sp){const s=SP[k]; if(s&&s.p){const a=v.sp[k]; tot+=a; r+=s.c[0]*a; g+=s.c[1]*a; b+=s.c[2]*a;}}
  if(tot<=0.01) return null;
  return {tot,col:[r/tot,g/tot,b/tot]};
}

  const fired=[],extra=[];let dissolvedOnce=false;
  v.heatLog.clear();

  const wasDry=v.vol<=0&&Object.keys(v.sp).some(k=>!(SP[k]&&(SP[k].sol)));

  const b=a.linkTo; if(!b) return;
  if(!S.vessels.includes(b)){a.linkTo=null; drawLinks(); return;}
  if(!a.linkQ||!a.linkQ.length) return;
  const it=a.linkQ.shift();
  if(!(b.vol>0)){ if(!a.linkDryLog){a.linkDryLog=true; logEntry(b,both('linkDry',{b:vName(b)}),[],[]);} return; }
  a.linkDryLog=false;
  const mp=GASAQ[it.g]; if(mp) for(const k in mp) b.sp[k]=(b.sp[k]||0)+mp[k]*it.a;
  spawnBubbles(b,7,1.2); b.gasHist.add(it.g);
  if(b.gasAvail&&b.gasAvail.g===it.g&&now()-b.gasAvail.t<25000) b.gasAvail.amt+=it.a; else b.gasAvail={g:it.g,amt:it.a,t:now()};
  b.gasAvail.t=now(); b.gasAvail.via=true;
  const fired=runReactions(b,isHeated(b));
  b.linkLog=b.linkLog||{};
  const fresh=fired.filter(i=>!b.linkLog[i]);
  if(fresh.length||!b.linkLog['g'+it.g]){
    fresh.forEach(i=>b.linkLog[i]=1); b.linkLog['g'+it.g]=1;
    logEntry(b,both('linkGas',{g:GASL[it.g],a:vName(a),b:vName(b)}),firedLines(fresh),[]);
  }
  renderVessel(b);
}
function removeObj(o){
  if(D&&D.v===o) closeDose();
  if(o.type){ S.vessels.forEach(x=>{if(x.linkTo===o) x.linkTo=null;}); o.linkTo=null; if(S.linkFrom===o) S.linkFrom=null; if(S.pourFrom===o) S.pourFrom=null; }
  if(o.type){ S.vessels=S.vessels.filter(x=>x!==o); if(S.sel===o) S.sel=null; logEntry(null,both('removed',{v:vName(o)}),[],[]); }
  else { S.lamps=S.lamps.filter(x=>x!==o); S.vessels.forEach(v=>{if(v.onBurner===o.id){v.onBurner=null;renderVessel(v);}}); }
  o.el.remove(); renderCard(); drawLinks();
}
function startPass(v){S.pass={from:v,g:v.gasAvail.g}; S.armed=null; refreshArm(); updateHint();}
function doPass(target){
  const p=S.pass; S.pass=null; updateHint();
  const src=p.from; if(target===src) return;
  if(!src.gasAvail||src.gasAvail.amt<=0.02) return;
  openDose(target,{kind:'gas',g:p.g,f:GASL[p.g],from:src,n:N('',''),col:'#8a96a0'});
}
function lampNear(v){
  // a lamp counts as "under" the vessel when the vessel's bottom sits near the flame
  const s=objSize(v),vx=v.x+s.w/2,vb=v.y+VT[v.type].h*(v.sc||1);
  let best=null,bd=1e9;
  S.lamps.forEach(l=>{const dx=Math.abs(vx-(l.x+55)),dy=vb-(l.y+16);
    if(dx<75&&dy>-120&&dy<150){const d=dx+Math.abs(dy)*.6; if(d<bd){bd=d;best=l;}}});
  return best;
}
function putOnLamp(v,l){
  S.vessels.forEach(o=>{if(o!==v&&o.onBurner===l.id){o.onBurner=null;o.x=l.x+120;placeEl(o);renderVessel(o);}});
  const s=objSize(v); v.onBurner=l.id;
  v.x=l.x+55-s.w/2; v.y=l.y+16-VT[v.type].h*(v.sc||1); placeEl(v);
  if(!l.lit){l.lit=true; renderLamp(l); logEntry(l,both('lampOn'),[],[]);}
  v.heatLog.clear();
  logEntry(v,both('heatStart',{v:vName(v)}),[],[]);
  renderVessel(v); select(v);
}
function takeOffLamp(v){
  const l=S.lamps.find(x=>x.id===v.onBurner); v.onBurner=null;
  if(l){v.x=l.x+125; placeEl(v);}
  logEntry(v,both('heatStop',{v:vName(v)}),[],[]); renderVessel(v); select(v);
}
function toggleLamp(l){
  l.lit=!l.lit; renderLamp(l);
  logEntry(l,both(l.lit?'lampOn':'lampOff'),[],[]);
  S.vessels.forEach(v=>{if(v.onBurner===l.id){v.heatLog.clear();renderVessel(v);}});
}

/* ================= heat / time loop ================= */
setInterval(()=>{
  const tnow=now();
  S.vessels.forEach(v=>{if(v.linkTo) linkTick(v);});
  S.vessels.forEach(v=>{
    let ch=false;
    if(isHeated(v)){
      if(v.vol>0&&(v.temp??22)>85&&Math.random()<.7) spawnBubbles(v,3,.9);
      const fired=runReactions(v,hotEnough(v));
      const fresh=fired.filter(i=>!v.heatLog.has(i));
      fresh.forEach(i=>v.heatLog.add(i));
      if(fresh.length){ logEntry(v,both('heatStart',{v:vName(v)}),firedLines(fresh),[]); }
      if(fired.length) ch=true;
    }else if(v.vol>0&&!v.busy){
      const fired=runReactions(v,false);
      if(fired.length){ch=true; logEntry(v,{en:vName(v),kz:vName(v)},firedLines(fired),[]);}
    }
    if(isHeated(v)&&v.vol>0){
      const dv=Math.min(v.vol,v.cap*.0025*((v.temp??22)>=95?1:(v.temp??22)>=60?.2:0)); v.vol-=dv; ch=true;
      if(v.vol<=1e-4){v.vol=0;
        ['CO2aq','NH3aq','SO2aq','H2Saq','Cl2aq','CH3COOHaq','H2O2'].forEach(k=>delete v.sp[k]);
        logEntry(v,both('evap',{v:vName(v)}),[],[]); v.heatLog.clear();}
    }
    v.slowT=v.slowT||{}; v.slowLog=v.slowLog||{};
    SLOW.forEach(sr=>{
      if(v.sp[sr.k]){
        if(!v.slowT[sr.k]) v.slowT[sr.k]=tnow;
        else if(tnow-v.slowT[sr.k]>sr.after){
          const a=Math.min(v.sp[sr.k],sr.rate); v.sp[sr.k]-=a; if(v.sp[sr.k]<1e-4) delete v.sp[sr.k];
          for(const k in sr.to) v.sp[k]=(v.sp[k]||0)+sr.to[k]*a; ch=true;
          if(!v.slowLog[sr.k]){v.slowLog[sr.k]=true; logEntry(v,{en:vName(v),kz:vName(v)},[{eq:sr.eq,o:sr.o}],[]);}
        }
      }else{delete v.slowT[sr.k]; delete v.slowLog[sr.k];}
    });
    if(ch||(v.pptT&&tnow-v.pptT<7000)||(v.gasAvail&&tnow-v.gasAvail.t<26000)) renderVessel(v);
  });
},400);

function updateHint(){

  const ions=[],pp=[],so=[];
  for(const k in v.sp){const s=SP[k]||{}; if(v.sp[k]<0.02) continue;
    if(s.p) pp.push(pill(lab(k)+'↓',rgb(s.c,1)));
    else if(s.sol) so.push(pill(lab(k),rgb(s.c,1)));
    else ions.push(pill(lab(k),s.c?rgb(s.c,1):null));}
  v.undis.forEach(()=>{}); if(v.undis.length) so.push(pill(t('dryNote').split('.')[0]));

  if(pp.length) h+=`<div class="grp"><div class="k">${t('ppt')}</div><div class="pills">${pp.join('')}</div></div>`;
  if(so.length) h+=`<div class="grp"><div class="k">${t('solids')}</div><div class="pills">${so.join('')}</div></div>`;

  c.innerHTML=h; if(typeof renderConsole==='function'){ renderConsole(); addCardAside(); }
  c.querySelector('#vPour').onclick=()=>{S.armed=null;S.linkFrom=null;S.pourFrom=v;refreshArm();updateHint();};
  if(v.linkTo||S.vessels.some(o=>o.linkTo===v)){const b=document.createElement('button');b.className='btn';b.textContent=t('unlinkBtn');b.onclick=()=>unlink(v);c.querySelector('.vact').appendChild(b);}
  if(v.thermo){const b=document.createElement('button');b.className='btn';b.textContent=t('thermoOut');b.onclick=()=>toggleThermo(v);c.querySelector('.vact').appendChild(b);}
  c.querySelector('#vHeat').onclick=()=>{
    if(v.onBurner){takeOffLamp(v);return;}
    let l=S.lamps.find(x=>!S.vessels.some(o=>o.onBurner===x.id))||S.lamps[0];
    if(!l) l=lampFor(v);

  };

let P=null,ghost=null;

function objDown(e,o,kind){
  if(e.button>0) return;

  const r=o.el.getBoundingClientRect();

}
document.addEventListener('pointermove',e=>{
  if(!P) return;
  if(!P.moved&&Math.hypot(e.clientX-P.sx,e.clientY-P.sy)>6){
    P.moved=true;
    if(P.mode==='pal'){ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=P.iconHTML;document.body.appendChild(ghost);}
    else{if(D&&D.v===P.o) closeDose(); P.o.el.classList.add('dragging'); const tr=document.getElementById('trash'); tr.hidden=false; tr.textContent=t('trash');
      if(P.kind==='vessel'&&P.o.onBurner){P.o.onBurner=null;}}
  }
  if(!P.moved) return;
  e.preventDefault();
  if(P.mode==='pal'){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    const u=document.elementFromPoint(e.clientX,e.clientY),hv=u&&u.closest('[data-vid],[data-lid]');
    document.querySelectorAll('.obj.target').forEach(x=>{if(x!==hv)x.classList.remove('target');}); if(hv) hv.classList.add('target');}
  else{
    const br=bench.getBoundingClientRect();

document.addEventListener('pointerup',e=>{

}

  m.innerHTML=`<div class="szt">${esc(L(pl.n))} · ${t('pickSize')}</div><div class="szb">${SIZES[pl.id].map(([c,k])=>`<button type="button" role="menuitemradio" aria-checked="${S.gsz[pl.id]===c}" data-c="${c}"><svg viewBox="0 0 20 24" width="${Math.round(12+k*8)}" height="${Math.round(14+k*10)}" aria-hidden="true">${pl.id==='flask'?'<path d="M8 2v6L3 20q-1 2 1 2h12q2 0 1-2L12 8V2z"/>':'<path d="M3 3l1 18q0 1 1 1h10q1 0 1-1l1-18z"/>'}</svg><span>${c} ${t('uML')}</span></button>`).join('')}</div>`;

}
document.addEventListener('pointerdown',e=>{const m=document.getElementById('szmenu'); if(m&&!m.contains(e.target)&&!e.target.closest('.titem')) closeSizeMenu();});
function objClick(o,kind){
  if(kind==='vessel'){
    if(S.pourFrom){const a=S.pourFrom; S.pourFrom=null; updateHint(); if(a!==o&&S.vessels.includes(a)) pour(a,o); else select(o); return;}
    if(S.linkFrom){finishLink(o);return;}
    if(S.pass){doPass(o);return;}
    if(S.armed){applyTo(S.armed,o); return;}
    select(o); renderVessel(o);
  }else{
    if(S.armed&&(S.armed.kind==='liquid'||S.armed.kind==='solid')&&o.lit){const a=S.armed; S.armed=null; refreshArm(); updateHint(); flameTest(o,a);return;}
    if(S.armed&&S.armed.kind==='gas'){note(o,'dropInto');return;}
    toggleLamp(o);
  }
}
function applyTo(pl,v){
  if(pl.kind==='liquid'||pl.kind==='solid'||pl.kind==='gas') openDose(v,pl);
  else if(pl.kind==='ind') addIndicator(v,pl);
  else if(pl.kind==='paper') paperTest(v,pl);
  else if(pl.kind==='splint') splintTest(v);
  else if(pl.kind==='link') startLink(v);
  else if(pl.kind==='thermo') toggleThermo(v);
}
bench.addEventListener('pointerup',e=>{
  if(P) return;
  if(e.target.closest('.obj')||e.target.closest('.hintbar')||e.target.closest('.dose')) return;
  if(S.armed&&(S.armed.kind==='glass'||S.armed.kind==='lamp')){
    const br=bench.getBoundingClientRect(); placeNew(S.armed,e.clientX-br.left,e.clientY-br.top);
  }
});
function placeNew(pl,x,y){
  if(pl.kind==='lamp') makeLamp(x-55,y-75);
  else{const d=VT[pl.id],cap=S.gsz[pl.id]||d.cap,szr=SIZES[pl.id]&&SIZES[pl.id].find(z=>z[0]===cap),k=szr?szr[1]:1; const v=makeVessel(pl.id,x-d.w*k/2,y-d.h*k/2,cap); select(v);}
}
function dropPayload(pl,cx,cy){
  const under=document.elementFromPoint(cx,cy);
  const br=bench.getBoundingClientRect();
  const inBench=cx>=br.left&&cx<=br.right&&cy>=br.top&&cy<=br.bottom;
  if(pl.kind==='glass'||pl.kind==='lamp'){ if(inBench) placeNew(pl,cx-br.left,cy-br.top); return; }
  const tv=under&&under.closest('[data-vid]'), tl=under&&under.closest('[data-lid]');
  if(tv){applyTo(pl,S.vessels.find(x=>x.id===+tv.dataset.vid));return;}
  if(tl){const l=S.lamps.find(x=>x.id===tl.dataset.lid); if(pl.kind==='liquid'||pl.kind==='solid') flameTest(l,pl); else note(l,'dropInto'); return;}
  if(inBench){const m=document.getElementById('hintMsg'); m.textContent=t('dropInto'); m.classList.add('on'); m.hidden=false; setTimeout(updateHint,2200);}
}

function outerAt(P,y){
  const p=P.pts; if(y<=p[0][1]) return p[0][0];

// path into a vessel: from a point above the mouth, into the mouth, then down the vessel's own axis to the liquid.

function along(pts,k){

function animateDose(v,rg,q,portions,step,done,colOverride){
  const C=css2c(colOverride||reagentCSS(rg)),c=C.c;

  if(rg.kind==='liquid'||rg.kind==='ind'){
    if(q.mode==='drop'){
      const dp=dropperMesh(c); dp.position.set(M.x,M.y+.18,M.z); grp.add(dp);

    }else{

      const piv=new T3.Group(); piv.position.set(M.x+side*.08,M.y+.25,M.z); grp.add(piv);
      b.position.set(0,-.72,0); piv.add(b);            // the bottle turns about its own mouth
      const top=new T3.Vector3(M.x+side*.08,M.y+.25,M.z);
      const st=new T3.Mesh(streamGeo(intoPath(v,top)),new T3.MeshStandardMaterial({color:c,transparent:true,opacity:.85,roughness:.1})); st.visible=false; scene.add(st);

          st.geometry.dispose(); st.geometry=streamGeo(intoPath(v,top)); setTimeout(tick,rm?0:220);};
        setTimeout(tick,rm?0:80);

  }else if(rg.kind==='solid'){
    const chunky=!!rg.insol, sp=spatulaMesh(c,chunky); const side=v.pos.x>TBL.x1-1.6?-1:1;
    const piv=new T3.Group(); piv.position.set(M.x+side*.05,M.y+.28,M.z); piv.scale.x=side; grp.add(piv); piv.add(sp);
    tween(700,k=>{const e=ease(k); piv.position.x=M.x+side*(.05+(1-e)*1.2); piv.position.y=M.y+.28+(1-e)*.5; piv.rotation.x=0; sp.rotation.x=0; piv.rotation.z=-side*0;},()=>{
      tween(450,k=>{sp.rotation.x=ease(k)*1.6;},()=>{
        // grains fall from the tipped bowl
        const n=chunky?6:16; sfx.rustle(chunky);
        for(let j=0;j<n;j++){const gm=new T3.Mesh(chunky?new T3.DodecahedronGeometry(.03,0):new T3.IcosahedronGeometry(.012,0),new T3.MeshStandardMaterial({color:c,roughness:.8}));
          const ox=(Math.random()-.5)*.06,oz=(Math.random()-.5)*.06; const path=intoPath(v,new T3.Vector3(M.x+ox,M.y+.25,M.z+oz)); gm.position.copy(path[0]); scene.add(gm);
          const t0=j*(chunky?70:28);
          setTimeout(()=>tween(380+Math.random()*160+pathLen(path)*60,k=>{gm.position.copy(along(path,k*k));},()=>{scene.remove(gm);gm.geometry.dispose();}),rm?0:t0);}

/* ---------- gas cylinders: stand on the back of the table, one per gas, painted in the usual cylinder colours ---------- */
const CYL=new Map();
const CYLC={O2:'#2e64b8',H2:'#2f6b3a',N2:'#1f2225',CO2:'#1f2225',SO2:'#1f2225',NH3:'#e2c22c',Cl2:'#6f7d48',H2S:'#e7e7e2',HCl:'#8a8f93',NO2:'#e7e7e2',N2O:'#7a8ea8'};
function labelTex(text,dark){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=96; const g=cv.getContext('2d');
  g.fillStyle=dark?'#f4f2ea':'#202428'; g.fillRect(0,0,512,96);

}
function gasCylinder(g,v){
  if(CYL.has(g)) return CYL.get(g);

  const used=[...CYL.values()].map(c=>c.x); let x=Math.max(TBL.x0+.4,Math.min(TBL.x1-.4,v.pos.x+.9));
  for(let k=0;k<30&&used.some(u=>Math.abs(u-x)<.6);k++) x=Math.max(TBL.x0+.4,Math.min(TBL.x1-.4,v.pos.x+.9+(k%2?-1:1)*Math.ceil((k+1)/2)*.6));
  const z=-1.95, root=new T3.Group(); root.position.set(x,0,z); scene.add(root);
  const col=cHex(CYLC[g]||'#9aa3aa');
  const body=new T3.Mesh(new T3.LatheGeometry([[0,0],[.19,0],[.22,.04],[.22,1.86],[.19,2.0],[.11,2.1],[.06,2.16],[.06,2.22]].map(p=>V2(p[0],p[1])),32),new T3.MeshStandardMaterial({color:col,metalness:.35,roughness:.38}));
  body.castShadow=true; body.receiveShadow=true; root.add(body);
  const foot=new T3.Mesh(new T3.CylinderGeometry(.24,.25,.07,28),MAT.dark); foot.position.y=.035; root.add(foot);
  const light=['#e2c22c','#e7e7e2','#8a8f93','#7a8ea8'].includes(CYLC[g]);
  const band=new T3.Mesh(new T3.CylinderGeometry(.223,.223,.28,32,1,true),new T3.MeshStandardMaterial({map:labelTex(GASL[g]||g,light),roughness:.6}));
  band.position.y=1.35; band.rotation.y=Math.PI/2; root.add(band);
  const valve=new T3.Mesh(new T3.CylinderGeometry(.055,.06,.16,14),new T3.MeshStandardMaterial({color:cHex('#c8a24a'),metalness:.8,roughness:.3})); valve.position.y=2.3; root.add(valve);
  const spout=new T3.Mesh(new T3.CylinderGeometry(.025,.025,.14,10),valve.material); spout.rotation.x=Math.PI/2; spout.position.set(0,2.3,.1); root.add(spout);
  const wheel=new T3.Group(); wheel.position.y=2.42; root.add(wheel);

  const c={g,x,root,
    outlet(){root.updateMatrixWorld(true); return root.localToWorld(new T3.Vector3(0,2.3,.17));},

  CYL.set(g,c);
  tween(350,k=>{root.position.y=(1-ease(k))*.6; root.scale.setScalar(.6+.4*ease(k));});
  sfx.thunk();
  return c;
}

/* ---------- pouring from one vessel into another: lift, tilt over the mouth, stream, return ---------- */
function pourAnim(a,b){
  if(!a.root||!b.root){a.busy=b.busy=false; return;}
  a.busy=true; b.busy=true; a.anim=true;
  const s=a.pos.x<=b.pos.x?-1:1;                         // which side of b the source stands on
  const Pa=PROF[a.type],sa=a.sc||1;
  const lipLocal=new T3.Vector3(-s*Pa.lip*sa,Pa.mouth*sa+a.body.position.y,0);
  const start=a.root.position.clone();
  const L0=start.clone().add(lipLocal);
  const MB=mouthWorld(b); const Lt=new T3.Vector3(MB.x+s*PROF[b.type].lip*(b.sc||1)*.35,MB.y+.22,MB.z);
  const thF=s<0?-1.75:1.75;
  const place=(L,th)=>{const r=lipLocal.clone().applyAxisAngle(new T3.Vector3(0,0,1),th); a.root.position.copy(L).sub(r); a.root.rotation.set(0,0,th);};
  if(a.rack) a.rack.visible=false;
  const lc=liquidColor(a); const col=lc?c3(...lc.col):c3(190,220,240);
  const st=new T3.Mesh(streamGeo(intoPath(b,Lt.clone()),.025),new T3.MeshStandardMaterial({color:col,transparent:true,opacity:.85,roughness:.1}));
  st.visible=false; scene.add(st);
  const steps=28; let i=0;
  tween(1000,k=>{const e=ease(k); place(L0.clone().lerp(Lt,e),thF*ease(Math.max(0,(k-.25)/.75)));},()=>{
    st.visible=true; sfx.pour(1.7);
    const tick=()=>{
      if(!S.vessels.includes(a)||!S.vessels.includes(b)){end();return;}
      i++; const f=1/(steps-i+1);
      for(const k in a.sp){const am=a.sp[k]*f; a.sp[k]-=am; b.sp[k]=(b.sp[k]||0)+am;}
      const dv=a.vol*f; if(b.vol+dv>0) b.temp=((b.temp??22)*b.vol+(a.temp??22)*dv)/(b.vol+dv); a.vol-=dv; b.vol+=dv;
      renderVessel(a); renderVessel(b);
      place(Lt,thF+(s<0?-1:1)*.25*i/steps);
      if(i>=steps){st.visible=false; back(); return;}
      setTimeout(tick,RM()?0:1500/steps);
    };
    tick();
  });
  const back=()=>{
    const th0=a.root.rotation.z;
    tween(800,k=>{const e=ease(k); place(Lt.clone().lerp(L0,e),th0*(1-e));},()=>end(true));
  };
  const end=(ok)=>{
    scene.remove(st); st.geometry.dispose();
    a.anim=false; a.root.rotation.set(0,0,0); syncRoot(a);
    if(ok){
      b.undis.push(...a.undis); if(a.ind&&!b.ind) b.ind=a.ind;
      washVessel(a,true); dissolveUndis(b); b.heatLog.clear();
      const fired=runReactions(b,isHeated(b));
      logEntry(b,both('poured',{a:vName(a),b:vName(b)}),firedLines(fired),fired.length?[]:[both('noChange')]);
      renderVessel(a); renderVessel(b); select(b);
    }
    a.busy=false; b.busy=false;
  };
}
function washVessel(v,silent){
  v.sp={}; v.vol=0; v.temp=22; v.undil=0; v.undis=[]; v.ind=null; v.slowT={}; v.slowLog={}; v.mirror=false; v.gasAvail=null; v.gasHist=new Set(); v.cloud=null; v.feT=0; v.feLog=false; v.heatLog.clear();
  for(let i=BUBS.length-1;i>=0;i--) if(BUBS[i].v===v){BUBS[i].m.parent&&BUBS[i].m.parent.remove(BUBS[i].m); BUBS.splice(i,1);}

/* ---------- rubber gas delivery tube ---------- */
const LINKS=new Map();

  if(!R3) return;

/* ---------- picking and pointer control ---------- */

  if(!hits.length) return null; const o=hits[0].object.userData.obj;

        const tp=tablePoint(...rel(e)); PT.off=tp?{x:o.pos.x-tp.x,z:o.pos.z-tp.z}:{x:0,z:0}; o.dragging=true; o.el.classList.add('dragging');

    if(!PT.moved) return;

    else if(PT.mode==='pan'){const k=CAM.r*.0016,ct=Math.cos(CAM.theta),st=Math.sin(CAM.theta),ddx=(e.clientX-PT.lx)*k,ddy=(e.clientY-PT.ly)*k;

    else if(PT.mode==='obj'){

    }

  stage.addEventListener('pointerup',e=>{if(PT){e.stopPropagation(); up(e);}});   // palette drops still bubble to the shared handler
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',e=>{PTRS.delete(e.pointerId); if(PT&&PT.mode==='obj'){PT.o.dragging=false;PT.o.el.classList.remove('dragging');placeEl(PT.o);document.getElementById('trash').hidden=true;} PT=null;});
  stage.addEventListener('wheel',e=>{e.preventDefault(); if(CAM.fly) return; CAM.r=Math.max(CAM.rMin,Math.min(CAM.rMax,CAM.r*(1+e.deltaY*.0012)));},{passive:false});

function pinchD(){const a=[...PTRS.values()]; return a.length<2?1:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}

/* ---------- frame loop ---------- */
let lastT=performance.now();
const _v=new T3.Vector3(), _box=new T3.Box3();

  placeCam(); stepShards(dt); sinkFrame(dt); assistantFrame(dt);

  });

    l.flame.visible=l.lit; l.light.intensity=VHIDE?0:l.lit?(.9+.15*Math.sin(tn/53))*(1+(1-LIGHT.k)*1.6):0; l.light.distance=6+(1-LIGHT.k)*4;
    if(l.lit){const f=1+.05*Math.sin(tn/61)+.04*Math.sin(tn/23); l.flame.scale.set(1/f*(testing?1.25:1),f*(testing?1.35:1),1/f*(testing?1.25:1));
      const want=testing?l.testC:'#ffb347'; if(l._fc!==want){l._fc=want; l.fo.material.color.copy(css2c(want).c); l.light.color.copy(css2c(testing?want:'#ffa860').c);} l.fi.visible=!testing;}

  });

/* ================= sound: synthesised with Web Audio (no sound files) ================= */
const SFX={ctx:null,on:true,master:null,noise:null,flameG:null,fizzT:0};
try{ SFX.on=localStorage.getItem('qrl-sound')!=='off'; }catch(e){}
function audio(){
  if(!SFX.on) return null;

    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    const c=SFX.ctx=new AC();

    const comp=c.createDynamicsCompressor(); SFX.master.connect(comp); comp.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; SFX.noise=b;

}
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(SFX.on&&SFX.ctx&&SFX.ctx.state==='suspended') SFX.ctx.resume(); },{passive:true}));

  f.frequency.setValueAtTime(o.f0||1000,t); if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);

  const s=c.createOscillator(); s.type=o.type||'sine';
  s.frequency.setValueAtTime(o.f0,t); if(o.f1) s.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.gain||.2,t+(o.att||.004)); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);

    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.12); g.gain.setValueAtTime(.16,t+Math.max(.15,dur-.2)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const lfo=c.createOscillator(); lfo.frequency.value=7+Math.random()*4; const lg=c.createGain(); lg.gain.value=.07; lfo.connect(lg); lg.connect(g.gain);
    const lfo2=c.createOscillator(); lfo2.frequency.value=3.3; const l2=c.createGain(); l2.gain.value=260; lfo2.connect(l2); l2.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(SFX.master); s.start(t); s.stop(t+dur+.1); lfo.start(t); lfo.stop(t+dur+.1); lfo2.start(t); lfo2.stop(t+dur+.1);

  rustle(chunky){ // powder sliding off the spatula, or pieces clinking on glass

  },
  fizz(a){ // crackling of gas bubbles bursting ("шытырлау"); louder and longer for more gas
    const now_=performance.now(); if(now_-SFX.fizzT<250) return; SFX.fizzT=now_;
    const dur=Math.min(3,.8+a*1.2),n=Math.round(Math.min(160,30+a*60));

  },

    for(let k=0;k<46;k++){const f=2400+Math.random()*5200; tn({f0:f,f1:f*(.92+Math.random()*.06),dur:.04+Math.random()*.22,gain:.05+Math.random()*.12,type:Math.random()<.5?'sine':'triangle',at:.04+Math.random()*1.1});}

  },

  tapOn(){ const c=audio(); if(!c||SFX.tap) return; const s=c.createBufferSource(); s.buffer=SFX.noise; s.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1150; f.Q.value=.6; const g=c.createGain(); g.gain.value=0; g.gain.setTargetAtTime(.11,c.currentTime,.12);

// gas given off by a reaction: same bookkeeping as the shared engine, plus the crackle of bubbles
function gasEvolved(v,g,a){
  v.gasHist.add(g);
  if(v.gasAvail&&v.gasAvail.g===g&&now()-v.gasAvail.t<25000) v.gasAvail.amt+=a; else v.gasAvail={g,amt:a,t:now()};
  v.gasAvail.t=now();
  if(v.vol>0){ spawnBubbles(v,Math.min(26,6+Math.round(a*14)),1.6); sfx.fizz(a); }
  else sfx.whoosh();
  if(v.linkTo&&S.vessels.includes(v.linkTo)){
    v.linkQ=v.linkQ||[]; let left=a;
    while(left>1e-4){const c=Math.min(left,.03); v.linkQ.push({g,a:c}); left-=c;}
    return;
  }
  if(GASC[g]) v.cloud={c:GASC[g],t:now()};
}

/* ================= explosion: an alkali metal in too little water shatters the vessel ================= */
const SHARD=[];
function explodeVessel(v){
  if(!S.vessels.includes(v)) return;
  sfx.boom(); setTimeout(()=>assistantScare(v),120);
  if(D&&D.v===v) closeDose();
  const lc=liquidColor(v), liqC=lc?c3(...lc.col):c3(190,220,240);
  if(v.root){
    v.root.updateMatrixWorld(true);
    const P=PROF[v.type], c=v.body.localToWorld(new T3.Vector3(0,P.mouth*.45,0));
    // fireball and a short, strong white flash that lights the room
    const fb=new T3.Sprite(new T3.SpriteMaterial({map:softTex(),color:cHex('#ffd27a'),transparent:true,opacity:1,depthWrite:false})); fb.position.copy(c); scene.add(fb);
    const L=BURNL.find(x=>!x.userData.busy)||BURNL[0]; L.userData.busy=true; L.position.copy(c);
    FX.push({t0:now(),ms:900,upd:k=>{fb.scale.setScalar(.4+k*2.4); fb.material.opacity=1-k; L.intensity=16*(1-k);},end:()=>{scene.remove(fb);fb.material.dispose();L.intensity=0;L.userData.busy=false;}});
    for(let k=0;k<5;k++){ const sm=new T3.Sprite(new T3.SpriteMaterial({map:softTex(),color:cHex('#8d959b'),transparent:true,opacity:0,depthWrite:false})); scene.add(sm);
      const ox=(Math.random()-.5)*.5,oz=(Math.random()-.5)*.5;
      FX.push({t0:now()+k*80,ms:3200,upd:q=>{sm.position.set(c.x+ox,c.y+.2+q*1.6,c.z+oz); sm.scale.setScalar(.6+q*1.8); sm.material.opacity=(q<.1?q/.1:1-(q-.1)/.9)*.55;},end:()=>{scene.remove(sm);sm.material.dispose();}}); }
    // glass shards and drops of the liquid fly out, bounce on the table and fade
    const gm=new T3.MeshStandardMaterial({color:cHex('#e3f0f6'),transparent:true,opacity:.6,roughness:.05,metalness:.15,side:T3.DoubleSide,depthWrite:false});
    const lm=new T3.MeshStandardMaterial({color:liqC,transparent:true,opacity:.85,roughness:.1});
    const R=P.lip*(v.sc||1);
    for(let k=0;k<34;k++){
      const s=.04+Math.random()*.11, geo=new T3.BufferGeometry();
      geo.setAttribute('position',new T3.BufferAttribute(new Float32Array([0,0,0,s,Math.random()*s*.6,0,Math.random()*s*.6,s*(.6+Math.random()),0]),3)); geo.computeVertexNormals();
      const m=new T3.Mesh(geo,gm.clone()); const a=Math.random()*Math.PI*2;
      m.position.set(c.x+Math.cos(a)*R,c.y+(Math.random()-.3)*.5,c.z+Math.sin(a)*R); scene.add(m);
      const sp=1.5+Math.random()*3;
      SHARD.push({m,vx:Math.cos(a)*sp,vy:1.5+Math.random()*3.5,vz:Math.sin(a)*sp*.7,rx:Math.random()*14,ry:Math.random()*14,t:0,life:5+Math.random()*2});
    }
    if(v.vol>0) for(let k=0;k<Math.min(40,10+v.vol*3);k++){
      const m=new T3.Mesh(new T3.SphereGeometry(.02+Math.random()*.03,8,6),lm.clone()); const a=Math.random()*Math.PI*2; m.position.copy(c); scene.add(m);
      const sp=1+Math.random()*2.6; SHARD.push({m,vx:Math.cos(a)*sp,vy:1+Math.random()*3,vz:Math.sin(a)*sp*.7,rx:0,ry:0,t:0,life:4,drop:true});
    }
    CAM.shake=.22;
  }
  logEntry(v,both('boomLog',{v:vName(v)}),[],[both('boomWhy')]);
  S.vessels.forEach(x=>{if(x.linkTo===v) x.linkTo=null;}); v.linkTo=null;
  if(S.linkFrom===v) S.linkFrom=null; if(S.pourFrom===v) S.pourFrom=null;
  S.vessels=S.vessels.filter(x=>x!==v); if(S.sel===v) S.sel=null;
  dispose3D(v); renderCard(); drawLinks(); updateHint();
}
function stepShards(dt){
  for(let i=SHARD.length-1;i>=0;i--){const s=SHARD[i]; s.t+=dt; const m=s.m;
    if(!s.rest){ s.vy-=9.8*dt; m.position.x+=s.vx*dt; m.position.y+=s.vy*dt; m.position.z+=s.vz*dt; m.rotation.x+=s.rx*dt; m.rotation.y+=s.ry*dt;
      const onTable=m.position.x>TBL.x0-.6&&m.position.x<TBL.x1+.6&&m.position.z>-3.1&&m.position.z<3.1, floor=onTable?.01:-9.3;
      if(m.position.y<=floor){ m.position.y=floor;
        if(s.drop){ s.rest=true; m.scale.set(1.8,.25,1.8); }
        else if(Math.abs(s.vy)>1.2){ s.vy*=-.3; s.vx*=.5; s.vz*=.5; s.rx*=.5; s.ry*=.5; if(Math.random()<.5) tn({f0:3000+Math.random()*3000,dur:.05,gain:.04}); }
        else { s.rest=true; m.rotation.x=-Math.PI/2+(Math.random()-.5)*.3; } } }
    if(s.t>s.life-1) m.material.opacity=Math.max(0,(s.life-s.t))*(s.drop?.85:.6);
    if(s.t>=s.life){ scene.remove(m); m.geometry.dispose(); SHARD.splice(i,1); }
  }
}

/* ================= temperature of the reaction mixture ================= */
const T_ROOM=22;
// heats of solution, kJ/mol (positive = the solution gets colder)
const DISS={sNaCl:3.9,sKCl:17.2,sLiCl:-37,sCaCl2:-81,sSrCl2:-52,sBaCl2:-13,sCuCl2:-51,sNa2CO3:-26.7,sNH4Cl:14.8,sKNO3:34.9,sNaHCO3:16.7,sCaOH2:-16,
  sCuSO4h:11.5,sCuSO4w:-66.5,sFeSO4h:12,sCuNO32:10,sPbNO32:37,sAgNO3:22.6,sNaNO3:20.5,sNH4NO3:25.7,sNH42CO3:16,sKMnO4:43.6,sCoCl2:12,sNiSO4:12};
// concentrated acids give off heat when they meet water: mmol of acid per mL and kJ per mol
const CONC={H2SO4c:{mm:18,dH:60},HNO3c:{mm:16,dH:15},HClc:{mm:12,dH:10}};
function tempOf(v){ if(v.temp==null) v.temp=T_ROOM; return v.temp; }
function heatQ(v,J,addVol){
  tempOf(v); const V=(v.vol||0)+(addVol||0);
  const C=V>0?4.18*Math.max(V,.3):2.5;                          // J per °C
  v.temp=Math.max(-15,Math.min(V>0?100.4:900,v.temp+J/C));
  if(V>0&&v.temp>=100&&J>0) spawnBubbles(v,8,1.5);
}
function onLiquidAdd(v,rg,ml){
  tempOf(v); const V0=v.vol;
  v.temp=V0>0?(v.temp*V0+T_ROOM*ml)/(V0+ml):T_ROOM;                // the reagent bottle is at room temperature
  const C=CONC[rg.id];
  if(C){ const mm=C.mm*ml, mixed=V0>0?Math.min(mm,mm*V0/ml):0;
    v.undil=(v.undil||0)+(mm-mixed); v.undilH=C.dH; if(mixed>0) heatQ(v,C.dH*mixed,ml); }
  else if(v.undil>0){ const mixed=Math.min(v.undil,18*ml); v.undil-=mixed; heatQ(v,(v.undilH||60)*mixed,ml); }
}
function hotEnough(v){const T=tempOf(v); return v.vol>0?T>=60:T>=150;}
// heats of reaction for the common exothermic reactions in the rule set
(function tagHeats(){
  const MW={Nas:-184,Ks:-196,Lis:-223,Rbs:-196,Css:-198,Cas:-414,Bas:-431};   // metal + water, per mol metal
  const MA={Mgs:-467,Zns:-153,Fes:-89,Als:-531,Cas:-543,Bas:-540,Nas:-240,Ks:-252,Lis:-278};  // metal + acid
  RULES.forEach(r=>{
    if(r.dH!=null||r.heat||r.dry) return;
    const ks=Object.keys(r.r);
    if(ks.length===2&&r.r['H+']&&r.r['OH-']){r.dH=-57*r.r['OH-'];return;}
    if(ks.length===2&&r.r['CH3COOHaq']&&r.r['OH-']){r.dH=-56;return;}
    if(ks.length===2&&r.r['NH3aq']&&r.r['H+']){r.dH=-52;return;}
    const m=ks.find(k=>MW[k]!=null||MA[k]!=null);
    if(m&&r.p['↑H2']){ if(ks.length===1&&MW[m]!=null) r.dH=MW[m]*r.r[m]; else if(r.r['H+']&&MA[m]!=null) r.dH=MA[m]*r.r[m]; return; }
    if(ks.length===1&&ks[0]==='CaO') r.dH=-65;
    if(ks.length===1&&ks[0]==='BaO') r.dH=-105;
    if(ks.length===1&&ks[0]==='Li2O') r.dH=-131;
    if(ks.length===1&&(ks[0]==='Na2O2'||ks[0]==='KO2')) r.dH=-110*r.r[ks[0]];
  });
})();
// heating over the flame and cooling in air
setInterval(()=>{
  const dt=.25;
  S.vessels.forEach(v=>{ tempOf(v);
    if(isHeated(v)){
      if(v.vol>0){ const rate=90/(4.18*Math.pow(Math.max(v.vol,.5),.65)); v.temp=v.temp<99.6?Math.min(100,v.temp+rate*dt):100+.25*Math.random(); }
      else v.temp=Math.min(v.type==='spoon'?700:450,v.temp+(v.type==='spoon'?45:25)*dt);
    }else{ const tau=v.vol>0?30+v.vol*1.2:14; v.temp+=(T_ROOM-v.temp)*(1-Math.exp(-dt/tau)); }
  });
},250);
function fmtT(T){ if(T==null) T=T_ROOM; if(T>150.5) return '> 150 °C'; let s=(Math.round(T*10)/10).toFixed(1); if(LANG==='kz') s=s.replace('.',','); return s+' °C'; }

  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; draw(cv.getContext('2d'),w,h);
  const t=new T3.CanvasTexture(cv); t.encoding=T3.sRGBEncoding; if(aniso&&R3) t.anisotropy=R3.capabilities.getMaxAnisotropy(); return t;

function ptPos(z){ // [row, column] in the 18-column layout; f-block on rows 8 and 9
  if(z===1) return [0,0]; if(z===2) return [0,17];
  const per=[[3,10,1],[11,18,2],[19,36,3],[37,54,4],[55,86,5],[87,118,6]];
  for(const [a,b,r] of per){ if(z<a||z>b) continue; const i=z-a;
    if(r<=2){ return i<2?[r,i]:[r,i+10]; }
    if(r<=4) return [r,i];
    if(z>=57&&z<=71) return [8,2+(z-57)]; if(z>=89&&z<=103) return [9,2+(z-89)];
    if(i<2) return [r,i]; if(z===57+15||z===89+15) return [r,3];
    return [r,i-14]; }

}

function toggleTap(){

function sinkFrame(dt){

  S.vessels.forEach(x=>{if(!x.root||x.anim) return; if(Math.hypot(x.pos.x-o.x,x.pos.z-o.z)<Math.max(.25,PROF[x.type].lip*(x.sc||1))) v=x;});

    const free=v.cap-v.vol; if(free>1e-3&&!v.busy){ const ml=Math.min(free,v.cap*.06*dt*4); const rg=LIQ.find(x=>x.id==='H2O');
      onLiquidAdd(v,rg,ml); v.vol+=ml; const f=runReactions(v,isHeated(v));
      if(SINK.logged!==v.id||f.length){ logEntry(v,both('tapFill',{v:vName(v)}),firedLines(f),[]); SINK.logged=v.id; }

  st.scale.y=Math.max(.05,o.y-bottom); st.position.set(o.x,(o.y+bottom)/2,o.z); st.scale.x=st.scale.z=1+.08*Math.sin(performance.now()/40);
}

function setSph(p,l){CAM.tx=l.x;CAM.ty=l.y;CAM.tz=l.z; CAM.r=p.distanceTo(l); CAM.phi=Math.acos(Math.max(-1,Math.min(1,(p.y-l.y)/CAM.r))); CAM.theta=Math.atan2(p.x-l.x,p.z-l.z);}

function roomClick(x,y){
  setRay(x,y); const h=RC.intersectObjects(ROOMPICK,false)[0]; if(!h) return false;
  const k=h.object.userData.room;
  if(k==='door'){ hideInfo(); CAM.outside?enterLab():exitLab(); return true; }
  if(CAM.outside) return false;
  if(k==='unit'){ hideInfo(); toggleUnit(h.object.userData.unit); return true; }
  if(k==='info'){ showInfo(h.object.userData.info,x,y); return true; }
  if(k==='tap'){ toggleTap(); showInfo('tap',x,y); return true; }
  if(k==='assistant'){ hideInfo(); sayTip(); return true; }

}
function renderNav(){
  const b=document.getElementById('bBack'),x=document.getElementById('bExit'),e=document.getElementById('bEnter'); if(!b) return;
  b.hidden=CAM.outside||CAM.view==='table'; x.hidden=CAM.outside; e.hidden=!CAM.outside;

  b.querySelector('span').textContent=t('backTable'); x.querySelector('span').textContent=t('exitLab'); e.querySelector('span').textContent=t('enterLab');
  labelsEl.style.visibility=CAM.outside?'hidden':'';

  document.getElementById('app').classList.toggle('outside',!!(CAM.outside||CAM.walking));
  document.getElementById('hintMsg').style.visibility=CAM.outside?'hidden':'';
}

/* ---------- base cabinets: plinth, carcass, drawer row and doors with bar handles ---------- */
function cabinetRun(x0,x1,z0,z1,faces,topY,fill){
  // hollow base units: every bay has a drawer (slides out) and a door (swings open); what is inside is built the first time it opens
  const P=pmats(), F=ROOM.y0, yT=(topY==null?0:topY), g=new T3.Group(); scene.add(g);
  const tH=.36, inset=.35, plH=1.0;
  const top=box(x1-x0,tH,z1-z0,P.top,(x0+x1)/2,yT-tH/2,(z0+z1)/2); top.receiveShadow=true; top.castShadow=true; g.add(top);
  const cx0=x0+inset*(faces.includes('-x')?1:0), cx1=x1-inset*(faces.includes('+x')?1:0), cz0=z0+inset*(faces.includes('-z')?1:0), cz1=z1-inset*(faces.includes('+z')?1:0);
  const yB=F+plH, cH=yT-tH-yB;
  g.add(box(cx1-cx0-.5,plH,cz1-cz0-.5,P.plinth,(cx0+cx1)/2,F+plH/2,(cz0+cz1)/2));
  // carcass shell: bottom, ends and a back (or centre) panel; bays are open at the front
  g.add(box(cx1-cx0,.1,cz1-cz0,P.inner,(cx0+cx1)/2,yB+.05,(cz0+cz1)/2));
  const two=faces.length>1;
  if(faces[0]==='+z'||faces[0]==='-z'){
    [cx0+.06,cx1-.06].forEach(x=>g.add(box(.12,cH,cz1-cz0,P.carc,x,yB+cH/2,(cz0+cz1)/2)));
    if(two) g.add(box(cx1-cx0,cH,.12,P.inner,(cx0+cx1)/2,yB+cH/2,(cz0+cz1)/2)); else g.add(box(cx1-cx0,cH,.12,P.inner,(cx0+cx1)/2,yB+cH/2,faces[0]==='+z'?cz0+.06:cz1-.06));
  }else{
    [cz0+.06,cz1-.06].forEach(z=>g.add(box(cx1-cx0,cH,.12,P.carc,(cx0+cx1)/2,yB+cH/2,z)));
    g.add(box(.12,cH,cz1-cz0,P.inner,faces[0]==='+x'?cx0+.06:cx1-.06,yB+cH/2,(cz0+cz1)/2));
  }
  faces.forEach(f=>{
    const alongX=f==='+z'||f==='-z', a0=alongX?cx0:cz0, a1=alongX?cx1:cz1, L=a1-a0, n=Math.max(1,Math.round(L/4.6)), w=L/n;
    const s=f[0]==='+'?1:-1, fixed=alongX?(s>0?cz1:cz0):(s>0?cx1:cx0);
    const D=(alongX?(cz1-cz0):(cx1-cx0))/(two?2:1)-.15;
    const dTop=yT-tH-.06, drH=1.7, dBot=yB+.06, dh=dTop-drH-dBot;
    const W=(u,y,d)=>alongX?new T3.Vector3(u,y,fixed-s*d):new T3.Vector3(fixed-s*d,y,u);   // u along the face, d inwards from the front
    const B=(wu,h,wd,mat)=>new T3.Mesh(alongX?new T3.BoxGeometry(wu,h,wd):new T3.BoxGeometry(wd,h,wu),mat);
    const N=alongX?new T3.Vector3(0,0,s):new T3.Vector3(s,0,0);
    for(let i=0;i<n;i++){
      const c=a0+w*(i+.5);
      if(i>0){const dv=B(.08,cH,D,P.inner); dv.position.copy(W(a0+w*i,yB+cH/2,D/2)); g.add(dv);}
      const rail=B(w,.08,D,P.inner); rail.position.copy(W(c,dTop-drH,D/2)); g.add(rail);
      // drawer: front + handle in a group that slides along the face normal
      const dg=new T3.Group(); dg.position.copy(W(c,dTop-drH/2,0)); g.add(dg);
      const fr=B(w-.08,drH-.08,.08,P.door); fr.position.copy(N).multiplyScalar(.04); dg.add(fr);

/* ---------- printed graduations: black scale, numbers and the volume, on the side facing the room ---------- */
function gradMesh(type,cap){
  const key=type+cap; gradMesh.c=gradMesh.c||{};
  let tex=gradMesh.c[key], P=PROF[type];
  const span=type==='beaker'?1.25:1.1;
  const y0=type==='beaker'?.05:.08, y1=type==='beaker'?1.05:.79, H=y1-y0;
  if(!tex){
    tex=gradMesh.c[key]=canvasTex(512,720,(g,w,h)=>{
      g.clearRect(0,0,w,h); g.fillStyle='#1d252b'; g.strokeStyle='#1d252b'; g.textBaseline='middle';
      const step=cap/10, lab=cap<=100?cap/5:cap/5, yOf=k=>h-((P.t+k*(P.fill-P.t))-y0)/H*h;
      for(let i=1;i<=10;i++){const ml=i*step,y=yOf(i/10),major=Math.abs(ml/lab-Math.round(ml/lab))<1e-6;
        g.lineWidth=major?6:4; g.beginPath(); g.moveTo(w*.38,y); g.lineTo(w*(major?.62:.54),y); g.stroke();
        if(major){g.font='bold 44px "Noto Sans",Arial'; g.textAlign='left'; g.fillText(String(ml),w*.66,y+2);}
        if(i<10&&type==='beaker'){const y2=yOf((i+.5)/10); g.lineWidth=3; g.beginPath(); g.moveTo(w*.38,y2); g.lineTo(w*.47,y2); g.stroke();}
      }
      g.textAlign='center'; g.font='bold 50px "Noto Sans",Arial';
      const ty=type==='beaker'?h*.04+24:yOf(.08)-12;
      if(type==='beaker') g.fillText(cap+' мл',w*.5,ty); else { g.font='bold 40px "Noto Sans",Arial'; g.fillText(cap+' мл',w*.5,yOf(.12)); }
      g.font='28px "Noto Sans",Arial'; g.fillText('≈',w*.25,yOf(.5));
    });
  }
  let geo;
  if(type==='beaker') geo=new T3.CylinderGeometry(.503,.503,H,40,1,true,-span/2,span);
  else geo=new T3.CylinderGeometry(outerAt(P,y1)+.003,outerAt(P,y0)+.003,H,40,1,true,-span/2,span);
  const m=new T3.Mesh(geo,new T3.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,toneMapped:false}));
  m.position.y=y0+H/2; m.renderOrder=4; return m;
}

    for(let i=0;i<9000;i++){const v=160+Math.floor(seeded(i)*50);g.fillStyle=`rgba(${v},${v+4},${v+8},.5)`;g.fillRect(seeded(i*3)*w,seeded(i*7)*h,2,2);}
    g.strokeStyle='rgba(120,132,140,.55)';g.lineWidth=3;g.strokeRect(0,0,w,h);},true);

/* a large window in the back wall: an opening with aluminium frames and a sill; the view outside changes from day to night */
const WIN={x0:-33.2,x1:-10.8,y0:2.4,y1:18.8,day:null,night:null};
function buildWindows(){
  const R=ROOM, x0=WIN.x0, x1=WIN.x1, y0=WIN.y0, y1=WIN.y1, z=R.z0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  WIN.day=skyTex(false); WIN.night=skyTex(true);
  const vm=new T3.MeshBasicMaterial({map:WIN.day}); LIGHT.windowMat=vm;
  const view=new T3.Mesh(new T3.PlaneGeometry(64,40),vm); view.position.set(cx,cy+2,z-14); scene.add(view);
  // reveal (the thickness of the wall round the opening)
  const rv=stdMat('#e1e6e9',{roughness:.8});
  [[x1-x0,.06,1,cx,y0,z-.5],[x1-x0,.06,1,cx,y1,z-.5],[.06,y1-y0,1,x0,cy,z-.5],[.06,y1-y0,1,x1,cy,z-.5]].forEach(([w,h,d,x,y,zz])=>scene.add(box(w,h,d,rv,x,y,zz)));
  const sheen=new T3.Mesh(new T3.PlaneGeometry(x1-x0,y1-y0),new T3.MeshPhysicalMaterial({color:0xffffff,roughness:.05,transparent:true,opacity:.07,clearcoat:1,envMapIntensity:1.2,depthWrite:false}));
  sheen.position.set(cx,cy,z-.5); scene.add(sheen);
  const fm=new T3.MeshStandardMaterial({color:cHex('#e9edf0'),metalness:.3,roughness:.4});
  const fr=(w,h,x,y)=>{const m=box(w,h,.36,fm,x,y,z-.5); m.castShadow=true; scene.add(m);};
  fr(x1-x0+.5,.4,cx,y1); fr(x1-x0+.5,.4,cx,y0); fr(.4,y1-y0,x0,cy); fr(.4,y1-y0,x1,cy);
  for(let i=1;i<4;i++) fr(.3,y1-y0,x0+i*(x1-x0)/4,cy);
  fr(x1-x0,.25,cx,y0+(y1-y0)*.7);
  scene.add(box(x1-x0+1.2,.25,.9,stdMat('#f3f5f6',{roughness:.5}),cx,y0-.1,z+.35));   // sill
  const bl=box(x1-x0+.6,.6,.5,stdMat('#d8dde0'),cx,y1+.75,z+.3); scene.add(bl);       // blind cassette
  const hit=box(x1-x0,y1-y0,.3,MAT.hit,cx,cy,z-.3); scene.add(roomPick(hit,'info')); hit.userData.info='window';
}
/* ---------- small real-lab cues: clock, fire extinguisher, emergency signs ---------- */
function buildExtras(){
  const R=ROOM;
  // wall clock over the sink, showing the real time
  const cv=document.createElement('canvas'); cv.width=cv.height=512; const g=cv.getContext('2d'); const tex=new T3.CanvasTexture(cv); tex.encoding=T3.sRGBEncoding;
  const draw=()=>{const d=new Date(),hh=d.getHours()%12,mm=d.getMinutes();
    g.fillStyle='#fff';g.beginPath();g.arc(256,256,250,0,Math.PI*2);g.fill();g.lineWidth=18;g.strokeStyle='#2c353c';g.stroke();
    g.fillStyle='#1d252b';for(let i=0;i<60;i++){const a=i/60*Math.PI*2,l=i%5?14:34,w=i%5?4:10;g.save();g.translate(256,256);g.rotate(a);g.fillRect(-w/2,-226,w,l);g.restore();}
    g.font='bold 54px "Noto Sans",Arial';g.textAlign='center';g.textBaseline='middle';for(let i=1;i<=12;i++){const a=i/12*Math.PI*2;g.fillText(String(i),256+Math.sin(a)*160,256-Math.cos(a)*160);}
    const hand=(a,l,w,c)=>{g.save();g.translate(256,256);g.rotate(a);g.fillStyle=c;g.fillRect(-w/2,-l,w,l+24);g.restore();};
    hand((hh+mm/60)/12*Math.PI*2,120,16,'#1d252b'); hand(mm/60*Math.PI*2,180,10,'#1d252b');
    g.fillStyle='#d4352a';g.beginPath();g.arc(256,256,12,0,Math.PI*2);g.fill(); tex.needsUpdate=true;};
  draw(); setInterval(draw,30000);
  const clk=new T3.Mesh(new T3.CircleGeometry(1.9,48),new T3.MeshStandardMaterial({map:tex,roughness:.4})); clk.rotation.y=-Math.PI/2; clk.position.set(R.x1-.12,14.2,SINK.z0+(SINK.z1-SINK.z0)/2); scene.add(clk);
  const rim=new T3.Mesh(new T3.TorusGeometry(1.92,.12,8,48),PM.black||stdMat('#22282d')); rim.rotation.y=Math.PI/2; rim.position.copy(clk.position); rim.position.x-=.02; scene.add(rim); pickInfo(rim,'clock');
  // fire extinguisher by the door, with its sign
  const fx=DOOR.x+DOOR.w/2+3.2, fz=R.z1-.75, red=stdMat('#c8231d',{roughness:.35,envMapIntensity:.8});
  const ext=new T3.Mesh(new T3.CylinderGeometry(.62,.62,4.6,24),red); ext.position.set(fx,R.y0+3.3+2.3,fz); scene.add(ext);
  const dome=new T3.Mesh(new T3.SphereGeometry(.62,24,10,0,Math.PI*2,0,Math.PI/2),red); dome.position.set(fx,R.y0+3.3+4.6,fz); scene.add(dome);
  const valve=box(.3,.6,.3,pmats().black,fx,R.y0+3.3+5.1,fz); scene.add(valve);
  const hose=new T3.Mesh(new T3.TubeGeometry(new T3.CatmullRomCurve3([[fx+.15,R.y0+8.6,fz],[fx+.8,R.y0+8,fz-.1],[fx+.8,R.y0+5,fz-.2],[fx+.5,R.y0+4.3,fz-.3]].map(a=>new T3.Vector3(...a))),20,.08,6),PM.black); scene.add(hose);
  scene.add(box(1.6,.3,.6,PM.alu,fx,R.y0+3.15,fz+.2)); pickInfo(ext,'extinguisher');
  const sign=(txt,bg,x,y,z,ry,w)=>{const m=new T3.Mesh(new T3.PlaneGeometry(w||2.6,1.3),new T3.MeshStandardMaterial({map:canvasTex(512,256,(c,W,H)=>{c.fillStyle=bg;c.fillRect(0,0,W,H);c.fillStyle='#fff';c.font='bold 60px "Noto Sans",Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,W/2,H/2);}),roughness:.5}));
    m.position.set(x,y,z); m.rotation.y=ry; scene.add(m);};
  sign('ӨРТ СӨНДІРГІШ','#c8231d',fx,R.y0+12.8,R.z1-.04,Math.PI,3.2);
  sign('ШЫҒУ','#1f8f4e',DOOR.x,R.y0+DOOR.h+1.1,R.z1-.04,Math.PI,2.6);
  // eyewash station by the sink
  const ew=new T3.Group(); ew.position.set(R.x1-.5,0,SINK.z1+3); scene.add(ew);
  const gm=stdMat('#1f9d55',{roughness:.45});
  ew.add(box(.6,6,.6,gm,0,ROOM.y0+3,0));
  [-1,1].forEach(s=>{const c=new T3.Mesh(new T3.CylinderGeometry(.42,.3,.4,16),gm); c.position.set(-.6,ROOM.y0+6.3,s*.45); ew.add(c);});
  sign('КӨЗ ЖУҒЫШ','#1f9d55',R.x1-.04,ROOM.y0+10,SINK.z1+3,-Math.PI/2,3); pickInfo(ew,'eyewash');
}

function infoText(k){const e=INFO[k]; return e?(e[LANG==='kz'?'kz':'en']||e.en):null;}
let infoEl=null, infoTimer=null;
function showInfo(k,x,y){
  const tx=infoText(k); if(!tx) return;
  if(!infoEl){ infoEl=document.createElement('div'); infoEl.className='infocard'; infoEl.setAttribute('role','status'); bench.appendChild(infoEl);
    infoEl.addEventListener('pointerdown',e=>e.stopPropagation()); }
  infoEl.innerHTML=`<b>${esc(tx[0])}</b><p>${esc(tx[1])}</p><button type="button" class="btn">${esc(t('infoClose'))}</button>`;
  infoEl.querySelector('button').onclick=hideInfo;
  const W=bench.clientWidth,H=bench.clientHeight, sr=stage.getBoundingClientRect(), br=bench.getBoundingClientRect();
  let px=(x==null?W/2:x+sr.left-br.left)+14, py=(y==null?H/2:y+sr.top-br.top)+14;
  infoEl.hidden=false; const cw=infoEl.offsetWidth||300, ch=infoEl.offsetHeight||120;
  px=Math.max(12,Math.min(W-cw-12,px)); py=Math.max(12,Math.min(H-ch-12,py));
  infoEl.style.transform=`translate(${px.toFixed(0)}px,${py.toFixed(0)}px)`;
  clearTimeout(infoTimer); infoTimer=setTimeout(hideInfo,9000);
}
function hideInfo(){ if(infoEl) infoEl.hidden=true; clearTimeout(infoTimer); }

/* a pickable volume round a prop, so tapping it shows its card */
function pickInfo(o,key){
  o.updateMatrixWorld(true);
  const bb=new T3.Box3().setFromObject(o), sz=bb.getSize(new T3.Vector3()), c=bb.getCenter(new T3.Vector3());
  const m=box(sz.x+.12,sz.y+.12,sz.z+.12,MAT.hit,c.x,c.y,c.z); scene.add(roomPick(m,'info')); m.userData.info=key; return m;
}
function itemPick(g,key){ // same, but as a child that moves with a drawer
  const bb=new T3.Box3().setFromObject(g), sz=bb.getSize(new T3.Vector3()), c=bb.getCenter(new T3.Vector3());
  const m=box(sz.x+.08,sz.y+.08,sz.z+.08,MAT.hit,c.x,c.y,c.z); g.add(roomPick(m,'info')); m.userData.info=key; return g;
}

const SMALL=['minerals','goggles','metals','tongs','spatula','pipette','litmus','tweezers','petri','gauze','lens','matches','brush','holder','notebooks'];
const BIG=['books','crucible','standparts','mortar','funnel','evapdish','gloves','notebooks','minerals','metals','petri','crucible'];
function fillUnit(u){
  u.built=true; const M=imats();

    // the drawer box behind the front, as deep as it slides out
    const od=u.od, U=u.alongX?new T3.Vector3(1,0,0):new T3.Vector3(0,0,1), inw=u.N.clone().negate(), wi=u.w-.5, hh=u.drH-.45, y0=-u.drH/2+.12;
    const at=(uu,y,d)=>U.clone().multiplyScalar(uu).addScaledVector(inw,d).setY(y);
    const mk=(a,b,c,x,y,d)=>{const m=new T3.Mesh(u.alongX?new T3.BoxGeometry(a,b,c):new T3.BoxGeometry(c,b,a),PM.inner); m.position.copy(at(x,y,d)); u.g.add(m);};
    mk(wi,.05,od,0,y0,od/2+.08); mk(wi,hh,.05,0,y0+hh/2,od+.08); [-1,1].forEach(s=>mk(.05,hh,od,s*wi/2,y0+hh/2,od/2+.08));
    const pick=[SMALL[(u.idx*3)%SMALL.length],SMALL[(u.idx*3+5)%SMALL.length]];
    pick.forEach((k,j)=>{const it=ITEMS[k](); it.position.copy(at((j?1:-1)*wi/4.2,y0+.03,od/2+.1)); if(!u.alongX) it.rotation.y=-Math.PI/2; it.scale.setScalar(Math.min(1,(wi/2-.1)/1.8)); u.g.add(it);});
  }else{

    const ks=[BIG[(u.idx*2)%BIG.length],BIG[(u.idx*2+3)%BIG.length],BIG[(u.idx*2+7)%BIG.length]];
    [[-1,u.dBot+.02,ks[0]],[1,u.dBot+.02,ks[1]],[0,sy+.05,ks[2]]].forEach(([side,y,k])=>{const it=ITEMS[k](); const p=W(u.c+side*u.w/4.2,y,Math.min(D/2,1.3)); it.position.copy(p);
      it.rotation.y=u.alongX?(u.s>0?0:Math.PI):(u.s>0?-Math.PI/2:Math.PI/2); it.scale.setScalar(Math.min(1.3,(u.w/2-.2)/1.8)); scene.add(it);});
  }
}
function toggleUnit(u){

    if(u.kind==='drawer') u.g.position.copy(u.base).addScaledVector(u.N,u.od*u.open); else u.g.rotation.y=u.ang*u.open;},()=>{u.busy=false;});

function buildSunlight(){
  const R=ROOM, cx=(WIN.x0+WIN.x1)/2;
  const L=new T3.DirectionalLight(0xfff1dc,.5); L.position.set(cx+5,36,R.z0-44); L.target.position.set(cx,R.y0,R.z0+22);

  scene.add(L,L.target); SUN.L=L; SUN.day=new T3.Color(0xfff1dc); SUN.night=new T3.Color(0x9db8ff);
  // a faint beam of light from the window to the floor, visible when the room is dark
  const d=L.target.position.clone().sub(L.position).normalize(), corners=[[WIN.x0,WIN.y0],[WIN.x1,WIN.y0],[WIN.x1,WIN.y1],[WIN.x0,WIN.y1]].map(([x,y])=>new T3.Vector3(x,y,R.z0+.1));
  const ends=corners.map(p=>p.clone().addScaledVector(d,(R.y0+.05-p.y)/d.y));
  const pos=[], al=[];
  for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4],a2=ends[i],b2=ends[(i+1)%4]; pos.push(...a.toArray(),...b.toArray(),...b2.toArray(),...a.toArray(),...b2.toArray(),...a2.toArray()); al.push(1,1,0,1,0,0);}
  const geo=new T3.BufferGeometry(); geo.setAttribute('position',new T3.Float32BufferAttribute(pos,3)); geo.setAttribute('alpha',new T3.Float32BufferAttribute(al,1));
  const mat=new T3.ShaderMaterial({transparent:true,depthWrite:false,side:T3.DoubleSide,blending:T3.AdditiveBlending,uniforms:{op:{value:0},col:{value:new T3.Color(0x7f9cff)}},
    vertexShader:'attribute float alpha; varying float va; void main(){ va=alpha; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform float op; uniform vec3 col; varying float va; void main(){ gl_FragColor=vec4(col*op*va,1.0); }'});
  SUN.shaft=new T3.Mesh(geo,mat); SUN.shaft.renderOrder=6; scene.add(SUN.shaft);
