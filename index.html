  const bridge=box(.2,.04,.04,stdMat('#3a4650'),0,.07,1.0); head.add(bridge);
  const mouth=new T3.Mesh(new T3.TorusGeometry(.14,.03,6,12,Math.PI),stdMat('#b5544b')); mouth.rotation.z=Math.PI; mouth.position.set(0,-.42,.92); head.add(mouth);
  P.mouth=mouth; const mo=new T3.Mesh(new T3.SphereGeometry(.13,10,8),stdMat('#5a2a26')); mo.scale.set(.8,1.1,.4); mo.position.set(0,-.45,.93); mo.visible=false; head.add(mo); P.mouthO=mo;
  g.traverse(o=>{if(o.isMesh) o.castShadow=true;});
  // tap water for her washing, separate from the tap the user controls
  const st=new T3.Mesh(new T3.CylinderGeometry(.06,.08,1,8),new T3.MeshStandardMaterial({color:c3(200,228,244),transparent:true,opacity:.7,roughness:.05})); st.visible=false; scene.add(st); AS.stream=st;
  // invisible body volume so she can be tapped
  const hit=box(3.6,16.5,2.4,MAT.hit,0,F+8.25,0); g.add(roomPick(hit,'assistant'));
  AS.idx=0; startStop();
}
function startStop(){ const [k,dur,face]=AS_ROUTE[AS.idx]; AS.state=dur>0?k:'pass'; AS.t=dur; AS.face=face; }
function nextLeg(){
  AS.idx=(AS.idx+1)%AS_ROUTE.length; const k=AS_ROUTE[AS.idx][0];
  AS.target=new T3.Vector3(AS_PTS[k][0],0,AS_PTS[k][1]); AS.state='walk';
}
function poseReset(){const P=AS.parts; ['legL','legR','armL','armR'].forEach(n=>P[n].rotation.set(0,0,0)); P.elL.rotation.set(0,0,0); P.elR.rotation.set(0,0,0); P.head.rotation.set(0,0,0);}
function turnTo(a,dt){let d=a-AS.g.rotation.y; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; AS.g.rotation.y+=d*Math.min(1,dt*6);}
function assistantFrame(dt){
  if(!AS.g) return;
  // her own real-time clock, so she keeps to her timetable even when frames are slow
  const nowS=performance.now()/1000; dt=Math.min(.25,AS.last?nowS-AS.last:0); AS.last=nowS;
  const P=AS.parts, g=AS.g, tn=nowS;
  AS.stream.visible=false; P.beaker.visible=false;
  if(P.mouthO){P.mouth.visible=true; P.mouthO.visible=false;}
  if(AS.scareT&&performance.now()<AS.scareT){
    // startled: a jump, hands up to the face, turned towards the bang, then a nervous look
    const left=(AS.scareT-performance.now())/2600, k=1-left, d=AS.scareAt.clone().sub(g.position);
    turnTo(Math.atan2(d.x,d.z),dt*2); poseReset();
    g.position.y=k<.25?Math.sin(k/.25*Math.PI)*1.4:Math.abs(Math.sin(tn*18))*.08*left;
    P.armL.rotation.x=-2.5; P.armR.rotation.x=-2.5; P.armL.rotation.z=-.35; P.armR.rotation.z=.35; P.elL.rotation.x=-1.6; P.elR.rotation.x=-1.6;
    P.head.rotation.x=-.25+Math.sin(tn*9)*.05; P.legL.rotation.x=-.25; P.legR.rotation.x=.15;
    P.mouth.visible=false; P.mouthO.visible=true;
  }else if(AS.state==='walk'){
    const d=AS.target.clone().sub(g.position); d.y=0; const L=d.length();
    if(L<.15){ startStop(); if(AS.state==='pass') nextLeg(); }
    else{ const step=Math.min(L,AS.speed*dt); g.position.addScaledVector(d.normalize(),step); turnTo(Math.atan2(d.x,d.z),dt);
      AS.phase+=step*.55; const s=Math.sin(AS.phase);
      poseReset(); P.legL.rotation.x=s*.5; P.legR.rotation.x=-s*.5; P.armL.rotation.x=-s*.4; P.armR.rotation.x=s*.4; P.elL.rotation.x=-.25; P.elR.rotation.x=-.25;
      g.position.y=Math.abs(Math.cos(AS.phase))*.18; }
  }else{
    g.position.y=0; if(AS.face!=null) turnTo(AS.face,dt);
    poseReset(); AS.t-=dt;
    if(AS.state==='hood'){            // both hands inside the hood, small careful movements
      P.armL.rotation.x=-1.15+Math.sin(tn*1.7)*.08; P.armR.rotation.x=-1.0+Math.sin(tn*2.3+1)*.12; P.elL.rotation.x=-.5; P.elR.rotation.x=-.65+Math.sin(tn*3)*.15;
      P.head.rotation.x=.18;
    }else if(AS.state==='sink'){      // washing a beaker under running water
      P.armL.rotation.x=-1.2+Math.sin(tn*5)*.12; P.armR.rotation.x=-1.25+Math.cos(tn*5)*.12; P.elL.rotation.x=-.35; P.elR.rotation.x=-.3;
      P.armL.rotation.z=-.25; P.armR.rotation.z=.25; P.head.rotation.x=.3; P.beaker.visible=true;
      const tp=SINK.tap; AS.stream.visible=true; AS.stream.scale.y=Math.max(.05,tp.y+.9); AS.stream.position.set(tp.x,(tp.y-.9)/2,tp.z);
    }else{                            // looking at the wall: portraits or periodic table
      P.head.rotation.x=-.15; P.head.rotation.y=Math.sin(tn*.8)*.2; P.armL.rotation.z=-.08; P.armR.rotation.z=.08;
    }
    if(AS.t<=0) nextLeg();
  }
  // speech bubble with a safety tip
  if(AS.tipEl){
    if(performance.now()>AS.tipT){AS.tipEl.remove(); AS.tipEl=null;}
    else{ const v=new T3.Vector3(0,ROOM.y0+17.6,0); g.localToWorld(v); v.project(camera);
      const w=stage.clientWidth,h=stage.clientHeight; AS.tipEl.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`;
      AS.tipEl.style.visibility=v.z<1&&!CAM.outside?'':'hidden'; }
  }
}
function sayTip(){
  const list=AS_TIPS[LANG==='kz'?'kz':'en'], tip=list[Math.floor(Math.random()*list.length)];
  if(AS.tipEl) AS.tipEl.remove();
  const el=document.createElement('div'); el.className='speech'; el.innerHTML=`<b>${esc(t('assistantName'))}</b>${esc(tip)}`; labelsEl.appendChild(el);
  AS.tipEl=el; AS.tipT=performance.now()+4500; sfx.click();
}

/* =====================================================================
   DESIGN LAYER: live instrument console for the selected vessel,
   collapsible panels, and a guided tour of the room
   ===================================================================== */
// temperature history for the console trace (one sample every 0.5 s, last 60 s)
setInterval(()=>{ S.vessels.forEach(v=>{ v.tHist=v.tHist||[]; v.tHist.push(tempOf(v)); if(v.tHist.length>120) v.tHist.shift(); }); },500);

function gaugeT(v){
  const has=!!v.thermo, T=has?v.thermo.shown:null, k=has?Math.max(0,Math.min(1,T/150)):0;
  const a0=Math.PI, a=a0-k*Math.PI, cx=60, cy=58, r=46;
  const arc=(t0,t1)=>{const x0=cx+r*Math.cos(t0),y0=cy-r*Math.sin(t0),x1=cx+r*Math.cos(t1),y1=cy-r*Math.sin(t1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  const nx=cx+(r-8)*Math.cos(a), ny=cy-(r-8)*Math.sin(a);
  const hot=has&&T>=60;
  let spark='';
  if(has&&v.tHist&&v.tHist.length>1){ const H=v.tHist,lo=Math.min(...H,15),hi=Math.max(...H,40),w=112,h=22;
    spark=`<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${H.map((x,i)=>`${(i/(119)*w).toFixed(1)},${(h-2-(x-lo)/(hi-lo)*(h-4)).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/></svg>`; }
  return `<div class="gauge"><div class="gk">${esc(t('tempL'))}</div>
    <svg viewBox="0 0 120 66" class="dial" aria-hidden="true"><path d="${arc(Math.PI,0)}" stroke="var(--line)" stroke-width="8" fill="none" stroke-linecap="round"/>
    ${has?`<path d="${arc(Math.PI,a)}" stroke="${hot?'#d4352a':'var(--accent)'}" stroke-width="8" fill="none" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1b2932" stroke-width="2.4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="#1b2932"/>`:''}
    <text x="10" y="65" font-size="8" fill="var(--muted)">0</text><text x="104" y="65" font-size="8" fill="var(--muted)">150</text></svg>
    <div class="gv${hot?' hot':''}">${has?esc(fmtT(T)):'—'}</div>${has?spark:`<div class="gnote">${esc(t('needThermo'))}</div>`}</div>`;
}
function gaugePH(v){
  const ph=pH(v);
  const stops=UNI.slice(1).map((c,i)=>`${rgb(c,1)} ${(i/13*100).toFixed(1)}%`).join(',');
  const pos=ph==null?null:Math.max(0,Math.min(100,(ph-1)/13*100));
  return `<div class="gauge"><div class="gk">pH</div>
    <div class="phbar" style="background:linear-gradient(90deg,${stops})">${pos==null?'':`<i style="left:${pos.toFixed(1)}%"></i>`}</div>
    <div class="phs"><span>1</span><span>7</span><span>14</span></div>
    <div class="gv">${ph==null?'—':(LANG==='kz'?ph.toFixed(1).replace('.',','):ph.toFixed(1))}</div>
    <div class="gnote">${ph==null?esc(t('noLiquid')):esc(ph<6.5?t('acidic'):ph>7.5?t('alkaline'):t('neutral'))}</div></div>`;
}
function gaugeV(v){
  const k=v.cap>0?Math.min(1,v.vol/v.cap):0, lc=liquidColor(v), col=lc?rgb(lc.col,Math.max(.5,lc.a)):'rgba(140,190,224,.5)';
  return `<div class="gauge"><div class="gk">${esc(t('vol'))}</div>
    <div class="vbar"><i style="height:${(k*100).toFixed(1)}%;background:${col}"></i></div>
    <div class="gv">${fmt(v.vol)}<small> / ${v.cap} ${esc(t('uML'))}</small></div></div>`;
}
function renderConsole(){
  const el=document.getElementById('vConsole'); if(!el) return;
  const v=S.sel; if(!v||!S.vessels.includes(v)){ el.innerHTML=''; return; }
  el.innerHTML=gaugeT(v)+gaugePH(v)+(v.type==='spoon'?'':gaugeV(v));
}
setInterval(renderConsole,250);

/* ---------- guided tour: the camera visits the room with captions; any touch hands control back ---------- */
const TOUR={on:false,i:0,timer:null,steps:['table','ptable','safety','portraits','hood','sink','ppe','logo','table']};
function tourCaption(text){
  let c=document.getElementById('tourCap');
  if(!c){c=document.createElement('div'); c.id='tourCap'; c.className='tourcap'; c.setAttribute('aria-live','polite'); bench.appendChild(c);}
  c.hidden=!text; c.innerHTML=text?`<span class="tn">${TOUR.i+1} / ${TOUR.steps.length}</span>${esc(text)}`:'';
}
function tourStep(){
  if(!TOUR.on) return;
  if(TOUR.i>=TOUR.steps.length){ stopTour(); return; }
  const k=TOUR.steps[TOUR.i]; focusView(k);
  tourCaption(t('tour_'+k+(TOUR.i===TOUR.steps.length-1?'_end':'')));
  TOUR.timer=setTimeout(()=>{TOUR.i++; tourStep();},RM()?2500:5200);
}
function startTour(){
  if(CAM.outside) return;
  TOUR.on=true; TOUR.i=0; closeDose(); closeSizeMenu(); renderPanelText(); tourStep();
  setTimeout(()=>{ ['pointerdown','wheel','keydown'].forEach(ev=>window.addEventListener(ev,stopTourOnInput,{once:true,capture:true})); },50);
}
function stopTourOnInput(e){ if(e.target&&e.target.closest&&e.target.closest('#bTour')) return; stopTour(); }
function stopTour(){
  if(!TOUR.on) return; TOUR.on=false; clearTimeout(TOUR.timer); tourCaption(''); renderPanelText();
  ['pointerdown','wheel','keydown'].forEach(ev=>window.removeEventListener(ev,stopTourOnInput,{capture:true}));
}
function bindTour(){
  const b=document.getElementById('bTour'); if(!b) return;
  b.addEventListener('click',()=>{ TOUR.on?stopTour():startTour(); });
}
// keep the floating panels stacked under the header and the tool rail, whatever their height
function layoutVars(){

  app.style.setProperty('--hdr',(hb.bottom-ab.top).toFixed(0)+'px');
  if(tb.height>0) app.style.setProperty('--tl',(tb.bottom-ab.top).toFixed(0)+'px');
}
['header','#tools'].forEach(q=>new ResizeObserver(layoutVars).observe(document.querySelector(q)));
window.addEventListener('resize',layoutVars);
stage.addEventListener('pointerdown',()=>{const c=document.getElementById('camHelp'); if(c) c.classList.add('gone');},{once:true});
bindPanels(); bindTour(); layoutVars();

/* ---------- the vessel card and the journal can be pushed to the screen edges ----------
   They slide aside on their own as soon as you start working in the scene (dragging a vessel,
   pouring, bringing a reagent or turning the camera), and come back from the small tabs */
const ASIDE={c:false,j:false,jSeen:0,auto:true};
Object.assign(UI.kz,{asideBtn:'Шетке',asideHint:'Шетке ысыру',cardTab:'Ыдыс ақпараты',journalTab:'Зертхана журналы',autoAside:'Тәжірибе кезінде өздігінен шетке ысыру'});
Object.assign(UI.en,{asideBtn:'Aside',asideHint:'Push to the edge',cardTab:'Vessel info',journalTab:'Lab journal',autoAside:'Push aside automatically during experiments'});
function jCount(){ return S.journal?S.journal.length:0; }
function setAside(which,on){
  if(ASIDE[which]===on) return; ASIDE[which]=on;
  if(which==='j'&&on) ASIDE.jSeen=jCount();
  document.getElementById(which==='c'?'vcard':'jcard').classList.toggle('aside',on);
  renderAsideTabs();
}
function renderAsideTabs(){
  const ct=document.getElementById('cardTab'), jt=document.getElementById('journalTab'); if(!ct||!jt) return;
  const v=S.sel&&S.vessels.includes(S.sel)?S.sel:null;
  ct.hidden=!ASIDE.c||!v; jt.hidden=!ASIDE.j;
  ct.querySelector('span').textContent=v?vname(v):t('cardTab');
  const n=Math.max(0,jCount()-ASIDE.jSeen);
  jt.querySelector('span').textContent=t('journalTab'); const b=jt.querySelector('.badge'); b.textContent=n; b.hidden=!n;
  ct.setAttribute('aria-label',t('cardTab')); jt.setAttribute('aria-label',t('journalTab')+(n?` (${n})`:''));
}
function vname(v){ return vName(v); }
function addCardAside(){
  const c=document.getElementById('vcard'); if(!c||c.querySelector('#cAside')||!S.sel) return;
  c.insertAdjacentHTML('afterbegin',`<button type="button" class="btn asidebtn" id="cAside" title="${esc(t('asideHint'))}">‹ ${esc(t('asideBtn'))}</button>`);
  c.querySelector('#cAside').addEventListener('click',()=>setAside('c',true));
}
function bindAside(){
  const foot=document.querySelector('.foot');
  foot.insertAdjacentHTML('beforeend',
    `<button type="button" class="sidetab left" id="cardTab" hidden><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></button>`+
    `<button type="button" class="sidetab right" id="journalTab" hidden><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span><b class="badge" hidden></b></button>`);
  document.getElementById('cardTab').addEventListener('click',()=>setAside('c',false));
  document.getElementById('journalTab').addEventListener('click',()=>setAside('j',false));
  // new journal lines while it is aside show up as a count on its tab
  new MutationObserver(()=>{ if(ASIDE.j) renderAsideTabs(); }).observe(document.getElementById('journal'),{childList:true});
  // working in the scene pushes both panels aside (only where they float over the 3D view)
  let st=null;
  window.addEventListener('pointerdown',e=>{
    const tg=e.target; st=null;
    if(!matchMedia('(min-width:821px)').matches||CAM.outside) return;
    if(tg.closest&&(tg.closest('#stage3d')||tg.closest('#labels .obj')||tg.closest('[data-pid]')||tg.closest('.ritem'))) st={x:e.clientX,y:e.clientY};
  },true);
  window.addEventListener('pointermove',e=>{
    if(!st||!ASIDE.auto) return;
    if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>12){ st=null; setAside('c',true); setAside('j',true); }
  },true);
  window.addEventListener('pointerup',()=>{st=null;},true);
  // a vessel card button to push it aside by hand
  setInterval(renderAsideTabs,400); addCardAside();
  document.head.insertAdjacentHTML('beforeend',`<style>
.sidetab,.asidebtn{display:none}
@media (min-width:821px){
  .foot .card{transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .3s}
  #vcard.aside{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  #jcard.aside{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  .asidebtn{display:inline-block;float:right;margin:-2px 0 4px 8px;padding:2px 9px;font-size:12px}
  .sidetab{position:absolute;bottom:0;display:inline-flex;align-items:center;gap:6px;max-width:260px;padding:8px 12px;border-radius:12px;border:1px solid var(--glass-edge,#d5dde2);background:var(--glass,#fff);box-shadow:var(--lift);font:inherit;font-size:13px;font-weight:600;color:var(--fg,#1d2a31);cursor:pointer;pointer-events:auto;animation:tabIn .35s cubic-bezier(.16,1,.3,1)}
  .sidetab[hidden]{display:none}
  .sidetab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidetab.left{left:0} .sidetab.right{right:0}
  .sidetab:hover{border-color:var(--accent);color:var(--accent)}
  .sidetab .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;line-height:20px;text-align:center}
  @keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.foot .card{transition:none}.sidetab{animation:none}}
</style>`);
}
